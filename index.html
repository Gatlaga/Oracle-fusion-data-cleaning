<style>

  .card .desc{color:var(--sub);font-size:12.5px;margin-bottom:14px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  select,input[type=text],input[type=number],input[type=password]{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px;}
  button.btn{background:var(--accent);border:none;color:#1a1206;font-weight:600;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;}
  button.btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line);}
  button.btn.ghost{background:none;color:var(--sub);border:1px solid var(--line);}
  button.btn.danger{background:var(--danger);color:#fff;}
  button.btn:disabled{opacity:.4;cursor:not-allowed;}
  button.btn.small{padding:4px 10px;font-size:12px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}

  td{padding:7px 8px;border-bottom:1px solid #232b35;vertical-align:middle;}
  tr:hover td{background:#1d2530;}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .tag.dup{background:#3a2226;color:var(--danger);}
  .progress-wrap{background:var(--panel2);border-radius:6px;height:8px;overflow:hidden;}
  .progress-bar{height:100%;background:var(--accent2);}
  .dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
  .dept-card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;}
  .dept-card .name{font-weight:600;font-size:13px;margin-bottom:6px;}
  .dept-card .stat{color:var(--sub);font-size:11.5px;margin-top:4px;}
  .empty{color:var(--sub);text-align:center;padding:30px;font-size:13px;}
  .child-block{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px;background:var(--panel2);}
  .flex-between{display:flex;justify-content:space-between;align-items:center;}
  .field-inline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px;}
  .field-inline label{color:var(--sub);font-size:11px;}
  .field-inline input{width:70px;padding:4px 6px;font-size:12px;}
  .search-box{position:relative;}
  .search-results{position:absolute;top:100%;left:0;right:0;background:var(--panel2);border:1px solid var(--line);border-radius:6px;max-height:220px;overflow:auto;z-index:20;margin-top:2px;}
  .search-results div{padding:7px 10px;cursor:pointer;font-size:12.5px;border-bottom:1px solid #232b35;}
  .search-results div:hover{background:#28323e;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;}

function toast(msg){

  setTimeout(()=>t.remove(), 2200);

// ---------- SUPABASE DATA LAYER ----------
async function loadAll(){
  if(!sb){ renderSetupScreen(); return; }
  try{
    const [d,f,c,i,l] = await Promise.all([
      sb.from('departments').select('*'),
      sb.from('father_assets').select('*'),
      sb.from('child_assets').select('*'),
      sb.from('items').select('*'),
      sb.from('links').select('*'),
    ]);
    for(const r of [d,f,c,i,l]){ if(r.error) throw r.error; }
    state.departments = (d.data || []).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    state.fatherAssets = f.data || [];
    state.childAssets = c.data || [];
    state.items = i.data || [];
    state.links = l.data || [];
    connOk = true;
  }catch(e){
    console.error(e);
    connOk = false;
    toast('Supabase холболтын алдаа: ' + e.message);
  }
  updateConnBadge();
  render();
}
function updateConnBadge(){
  const b = document.getElementById('connBadge');
  if(!sb){ b.textContent = 'Тохируулаагүй'; b.className = 'conn-badge conn-bad'; return; }
  b.textContent = connOk ? 'Холбогдсон' : 'Холболтын алдаа';
  b.className = 'conn-badge ' + (connOk ? 'conn-ok' : 'conn-bad');
}

async function dbInsert(table, row){
  const { error } = await sb.from(table).insert(row);
  if(error){ toast('Алдаа: '+error.message); throw error; }
}
async function dbUpdate(table, id, patch){
  const { error } = await sb.from(table).update(patch).eq('id', id);
  if(error){ toast('Алдаа: '+error.message); throw error; }
}
async function dbDelete(table, id){
  const { error } = await sb.from(table).delete().eq('id', id);
  if(error){ toast('Алдаа: '+error.message); throw error; }
}
async function dbDeleteMatch(table, col, val){
  const { error } = await sb.from(table).delete().eq(col, val);
  if(error){ toast('Алдаа: '+error.message); throw error; }
}

// ---------- LOGIN ----------
function renderLogin(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  document.getElementById('navBar').innerHTML = '';
  updateConnBadge();

  const wrap = document.createElement('div');
  wrap.style.cssText = 'max-width:440px;margin:50px auto;';

  const c = document.createElement('div'); c.className='card';
  c.innerHTML = `<h2 style="font-size:16px">Нэвтрэх</h2>
    <div class="desc">Алба нэгжээ сонгоод нууц үгээ оруулна уу. Админ бол доор "Админ" сонгоно.</div>`;

  const roleRow = document.createElement('div'); roleRow.className='row'; roleRow.style.marginBottom='12px';
  let mode = 'manager';
  const mgrBtn = document.createElement('button'); mgrBtn.className='btn'; mgrBtn.textContent='Алба нэгжийн менежер';
  const admBtn = document.createElement('button'); admBtn.className='btn secondary'; admBtn.textContent='Админ';
  function setMode(m){ mode=m; mgrBtn.className = m==='manager'?'btn':'btn secondary'; admBtn.className = m==='admin'?'btn':'btn secondary'; drawForm(); }
  mgrBtn.onclick=()=>setMode('manager'); admBtn.onclick=()=>setMode('admin');
  roleRow.append(mgrBtn, admBtn);
  c.appendChild(roleRow);

  const formWrap = document.createElement('div');
  c.appendChild(formWrap);

  function drawForm(){
    formWrap.innerHTML='';
    if(mode==='manager'){
      const deptSel = document.createElement('select'); deptSel.style.cssText='width:100%;margin-bottom:10px;';
      deptSel.innerHTML = '<option value="">-- Алба нэгжээ сонго --</option>' +
        state.departments.map(d=>`<option value="${escapeHtml(d.name)}">${escapeHtml(d.name)}</option>`).join('');
      const pwd = document.createElement('input'); pwd.type='password'; pwd.placeholder='Нууц үг'; pwd.style.cssText='width:100%;margin-bottom:10px;';
      const btn = document.createElement('button'); btn.className='btn'; btn.textContent='Нэвтрэх'; btn.style.width='100%';
      const err = document.createElement('div'); err.className='desc'; err.style.color='var(--danger)';
      btn.onclick = ()=>{
        const dname = deptSel.value;
        if(!dname){ err.textContent='Алба нэгжээ сонгоно уу'; return; }
        const dept = state.departments.find(d=>d.name===dname);
        if(!dept || (dept.password||'') !== pwd.value){ err.textContent='Нууц үг буруу байна'; return; }
        session = { role:'manager', deptName:dname };
        state.currentDept = dname;
        state.currentTab = 'asset';
        render();
      };
      pwd.onkeydown = e=>{ if(e.key==='Enter') btn.click(); };
      formWrap.append(deptSel, pwd, btn, err);
    } else {
      const pwd = document.createElement('input'); pwd.type='password'; pwd.placeholder='Админ нууц үг'; pwd.style.cssText='width:100%;margin-bottom:10px;';
      const btn = document.createElement('button'); btn.className='btn'; btn.textContent='Нэвтрэх'; btn.style.width='100%';
      const err = document.createElement('div'); err.className='desc'; err.style.color='var(--danger)';
      btn.onclick = ()=>{
        if(pwd.value !== ADMIN_PASSWORD){ err.textContent='Нууц үг буруу байна'; return; }
        session = { role:'admin', deptName:null };
        state.currentTab = 'admin';
        render();
      };
      pwd.onkeydown = e=>{ if(e.key==='Enter') btn.click(); };
      formWrap.append(pwd, btn, err);
    }
  }
  drawForm();
  wrap.appendChild(c);
  app.appendChild(wrap);
}

// ---------- NAV ----------
function renderNav(){
  const nav = document.getElementById('navBar');
  nav.innerHTML = '';
  let tabs;
  if(session.role==='admin'){
    tabs = [['admin','Ерөнхий/Тохиргоо'],['asset','Asset шалгах'],['item','Item шалгах'],['matrix','Item↔Asset холбох'],['export','Экспорт'],['guide','Заавар']];
  } else {
    tabs = [['asset','Asset шалгах'],['item','Item (Spare parts) шалгах'],['matrix','Item↔Asset холбох'],['export','Экспорт'],['guide','Заавар']];
  }
  tabs.forEach(([key,label])=>{
    const b = document.createElement('button');
    b.textContent = label;
    b.className = state.currentTab===key ? 'active':'';
    b.onclick = ()=>{ state.currentTab=key; render(); };
    nav.appendChild(b);
  });
  // logout button
  const lo = document.createElement('button');
  lo.className = 'logout-btn';
  lo.innerHTML = `<span style="opacity:.7">${session.role==='admin'?'Админ':session.deptName}</span> · Гарах`;
  lo.style.marginLeft = '8px';
  lo.onclick = ()=>{ if(confirm('Гарах уу?')){ session={role:null,deptName:null}; state.currentDept=null; render(); } };
  nav.appendChild(lo);
}

function renderSetupScreen(){
  updateConnBadge();
  const app = document.getElementById('app');
  app.innerHTML = '';
  document.getElementById('navBar').innerHTML = '';
  const wrap = document.createElement('div'); wrap.className='setup-screen';
  wrap.innerHTML = `<h2>Supabase холболт тохируулаагүй байна</h2>
    <p class="desc">index.html файлын эхэнд байгаа <b>SUPABASE_ANON_KEY</b> утгыг

  app.appendChild(wrap);
}

// ---------- RENDER ROOT ----------
function render(){
  if(!sb){ renderSetupScreen(); return; }
  if(!session.role){ renderLogin(); return; }
  renderNav();
  updateConnBadge();
  const app = document.getElementById('app');
  app.innerHTML = '';
  // managers can't access admin tabs
  if(session.role==='manager' && state.currentTab==='admin'){
    state.currentTab = 'asset';
  }
  // migrate old 'work' tab to new 'asset'
  if(state.currentTab==='work') state.currentTab = 'asset';
  if(state.currentTab==='admin') renderAdmin(app);
  else if(state.currentTab==='asset') renderAssetTab(app);
  else if(state.currentTab==='item') renderItemTab(app);
  else if(state.currentTab==='matrix') renderMatrix(app);
  else if(state.currentTab==='guide') renderGuide(app);
  else renderExport(app);
}

// ================= ADMIN TAB =================
function deptProgressStatus(deptName){
  const f = state.fatherAssets.filter(a=>a.department===deptName);
  const cList = state.childAssets.filter(x=>x.department===deptName);
  const cIds = cList.map(x=>x.id);
  const myItems = state.items.filter(it=>it.department===deptName);
  const activeItems = myItems.filter(it=>it.status==='active' || it.status==='removed');
  const links = state.links.filter(x=>cIds.includes(x.child_asset_id));
  return {
    assetClaimed: f.length,
    childDone: cList.length,
    itemClaimed: myItems.length,
    itemReviewed: activeItems.length,
    linksMade: links.length,
    // step completion booleans
    step1: f.length>0,                                   // Asset claim
    step2: cList.length>0,                                // Child задлах
    step3: myItems.length>0,                              // Item claim
    step4: myItems.length>0 && activeItems.length===myItems.length,  // бүх item шалгасан
    step5: links.length>0,                               // Item-Asset холбосон
  };
}

function stepDot(done){
  return `<span style="display:inline-block;width:16px;height:16px;border-radius:50%;background:${done?'var(--accent2)':'var(--line)'};color:${done?'#000':'var(--sub)'};text-align:center;line-height:16px;font-size:10px;font-weight:700;">${done?'✓':'·'}</span>`;
}

function renderAdmin(app){
  // ===== ЯВЦЫН DASHBOARD (дээд талд) =====
  const dash = card('📊 Алба нэгж бүрийн явц — Dashboard', '');

  // Global progress bars
  const totalFather = state.fatherAssets.length;

  const activeItemsN = state.items.filter(it=>it.status==='active').length;
  dash.appendChild(progressRow(`Father asset хуваарилагдсан (${claimedFather}/${totalFather})`, claimedFather, totalFather||1));
  dash.appendChild(progressRow(`Item баталгаажсан (${activeItemsN}/${state.items.length})`, activeItemsN, state.items.length||1));

  // Per-department big cards
  const dGrid = document.createElement('div');
  dGrid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px;';

  state.departments.forEach(d=>{
    const s = deptProgressStatus(d.name);
    const myItems = state.items.filter(it=>it.department===d.name);
    const activeI = myItems.filter(it=>it.status==='active').length;
    const removeI = myItems.filter(it=>it.status==='removed'||it.status==='remove_pending').length;

    // completion percent
    const steps = [s.step1,s.step2,s.step3,s.step4,s.step5];
    const donePct = Math.round(steps.filter(Boolean).length/5*100);
    const barColor = donePct===100?'var(--accent2)':donePct>=60?'#f0a500':'var(--accent)';

    const dc = document.createElement('div');
    dc.style.cssText='background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;';
    dc.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <strong style="font-size:15px">${escapeHtml(d.name)}</strong>
        <span style="font-size:13px;font-weight:700;color:${barColor}">${donePct}%</span>
      </div>
      <div style="background:var(--panel2);border-radius:4px;height:6px;margin-bottom:12px">
        <div style="background:${barColor};width:${donePct}%;height:6px;border-radius:4px;transition:width .3s"></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px">
        <div style="text-align:center;background:var(--panel2);padding:8px;border-radius:6px">
          <div style="font-size:20px;font-weight:700;color:var(--accent)">${s.assetClaimed}</div>
          <div style="font-size:10px;color:var(--sub)">Father Asset</div>
        </div>

function progressRow(label, num, den){

    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>`;

async function handleCsvImport(e, kind){
  const file = e.target.files[0];
  if(!file) return;
  Papa.parse(file, { header:true, skipEmptyLines:true, complete: async (res)=>{
    const cols = res.meta.fields || [];
    openColumnMapModal(kind, cols, res.data);
  }});
}

function openColumnMapModal(kind, cols, rows){
  const root = document.getElementById('modalRoot');
  const fields = kind==='father'
    ? [
        ['code','Код (Asset Number)'],
        ['name','Нэр (Asset Description)'],
        ['assetGroup','Asset Group (заавал биш)'],
        ['assetCategory','Asset Category (заавал биш)'],
        ['processArea','Process Area (заавал биш)'],
        ['department','Санал болгож буй алба нэгж → автоматаар хуваарилна'],
      ]
    : [
        ['code','Код'],['name','Нэр'],['category','Категори'],
        ['min','Min'],['max','Max'],['uom','UOM'],
        ['department','Алба нэгж (лавлагаа, заавал биш)'],
        ['note','Тайлбар (заавал биш)'],
      ];
  const bg = document.createElement('div'); bg.className='modal-bg';
  const modal = document.createElement('div'); modal.className='modal';
  modal.innerHTML = `<h3>${kind==='father'?'Father Asset':'Item'} багана харгалзуулах</h3>
    <div class="desc">CSV-ийн ямар багана юу болохыг сонгоно уу. (${rows.length} мөр)</div>`;
  const selects = {};
  // Auto-guess mapping
  const guessMap = {
    code: ['asset number','number','код','code'],
    name: ['asset description','description','нэр','name','тайлбар'],
    assetGroup: ['asset group','group'],
    assetCategory: ['asset category','category','ангилал'],
    processArea: ['process area','process','байршил'],
    department: ['санал болгож','алба нэгж','department','хариуцах'],
    min: ['min'], max: ['max'], uom: ['uom'],
    note: ['тайлбар','note','comment'],
  };
  fields.forEach(([key,label])=>{
    const colDiv = document.createElement('div'); colDiv.className='col';
    colDiv.innerHTML = `<label>${label}</label>`;
    const sel = document.createElement('select');
    sel.innerHTML = '<option value="">-- сонгох --</option>' + cols.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    const keywords = guessMap[key]||[key];
    const guess = cols.find(c=>keywords.some(k=>norm(c).includes(k)));
    if(guess) sel.value = guess;
    colDiv.appendChild(sel);
    modal.appendChild(colDiv);
    selects[key] = sel;
  });
  const btnRow = document.createElement('div'); btnRow.className='row'; btnRow.style.justifyContent='flex-end';
  const cancel = document.createElement('button'); cancel.className='btn ghost'; cancel.textContent='Цуцлах'; cancel.onclick=()=>bg.remove();
  const ok = document.createElement('button'); ok.className='btn'; ok.textContent='Импортлох';
  ok.onclick = async ()=>{
    const mapping = {}; fields.forEach(([key])=>mapping[key]=selects[key].value);
    if(!mapping.code || !mapping.name){ toast('Код, Нэр багана заавал сонгоно уу'); return; }
    ok.disabled = true; ok.textContent = 'Импортлож байна...';
    await runImport(kind, mapping, rows);
    bg.remove();
  };
  btnRow.append(cancel, ok);
  modal.appendChild(btnRow);
  bg.appendChild(modal);
  root.appendChild(bg);
}

const REMOVE_KEYWORDS = ["хасах","давхард","хэрэглэхгүй","утгах","байхгүй","ашиглахгүй","шаардлагагүй"];
function detectStatus(note){
  const n = norm(note);
  if(!n) return 'needs_review';
  return REMOVE_KEYWORDS.some(k=>n.includes(k)) ? 'remove_pending' : 'needs_review';
}

async function runImport(kind, mapping, rows){
  const BATCH = 500;
  if(kind==='father'){
    const existingCodes = new Set(state.fatherAssets.map(a=>a.code));
    // valid dept names for auto-assign
    const validDepts = new Set(state.departments.map(d=>norm(d.name)));
    const toInsert = [];
    rows.forEach(r=>{
      const code = (r[mapping.code]||'').toString().trim();
      const name = (r[mapping.name]||'').toString().trim();
      if(!code || existingCodes.has(code)) return;
      // Auto-assign department from CSV
      const suggestedRaw = mapping.department ? (r[mapping.department]||'').toString().trim() : '';
      const matchedDept = state.departments.find(d=>norm(d.name)===norm(suggestedRaw));
      const dept = matchedDept ? matchedDept.name : null;
      toInsert.push({
        id: uid(), code, name,
        department: dept,
        source: 'import',
        // store extra fields in name for now
      });
      existingCodes.add(code);
    });
    let imported=0;
    for(let i=0;i<toInsert.length;i+=BATCH){
      const chunk = toInsert.slice(i,i+BATCH);
      const { error } = await sb.from('father_assets').insert(chunk);
      if(error){ toast('Импортын алдаа: '+error.message); break; }
      state.fatherAssets.push(...chunk);
      imported+=chunk.length;
    }
    const assigned = toInsert.filter(x=>x.department).length;
    toast(`${imported} father asset импортлогдлоо (${assigned} нь алба нэгжид хуваарилагдсан)`);
  } else {
    const existingCodes = new Set(state.items.map(i=>i.code));
    const toInsert = [];
    rows.forEach(r=>{
      const code = (r[mapping.code]||'').toString().trim();
      const name = (r[mapping.name]||'').toString().trim();
      if(!code || existingCodes.has(code)) return;
      const note = mapping.note ? (r[mapping.note]||'').toString().trim() : '';
      const suggestedDept = mapping.department ? (r[mapping.department]||'').toString().trim() : '';
      toInsert.push({
        id: uid(), code, name,
        category: mapping.category ? (r[mapping.category]||'').toString().trim() : '',
        min: mapping.min ? (r[mapping.min]||'').toString().trim() : '',
        max: mapping.max ? (r[mapping.max]||'').toString().trim() : '',
        uom: mapping.uom ? (r[mapping.uom]||'').toString().trim() : '',
        department: null,
        suggested_department: suggestedDept,
        status: detectStatus(note),
        note: note,
      });
      existingCodes.add(code);
    });
    for(let i=0;i<toInsert.length;i+=BATCH){
      const chunk = toInsert.slice(i,i+BATCH);
      const { error } = await sb.from('items').insert(chunk);
      if(error){ toast('Импортын алдаа: '+error.message); break; }
      state.items.push(...chunk);
    }
    toast(`${toInsert.length} item импортлогдлоо`);
  }
  render();
}

function ensureDept(app, subtitle){
  if(session.role==='manager'){
    state.currentDept = session.deptName;
    return true;
  }
  const sel = card('Алба нэгжээ сонгоно уу', subtitle||'Дараа нь тухайн алба нэгжийн ажлыг гүйцэтгэнэ.');
  const row = document.createElement('div'); row.className='row';
  const s = document.createElement('select'); s.style.minWidth='260px';
  s.innerHTML = '<option value="">-- сонгох --</option>' + state.departments.map(d=>`<option ${state.currentDept===d.name?'selected':''} value="${escapeHtml(d.name)}">${escapeHtml(d.name)}</option>`).join('');
  s.onchange = ()=>{ state.currentDept = s.value || null; render(); };
  row.appendChild(s);
  sel.appendChild(row);
  app.appendChild(sel);
  if(!state.currentDept){
    app.appendChild(el('div','empty','Ажиллах алба нэгжээ сонгоно уу'));
    return false;
  }
  return true;
}

// ================= ITEM TAB =================
function renderItemTab(app){
  if(!ensureDept(app, 'Item (Spare parts) шалгаж баталгаажуулах.')) return;
  const dept = state.currentDept;

  if(session.role==='manager'){
    const b = card(`Таны алба нэгж: ${dept} — Item (Spare parts) шалгах`, '(1) өөрийн item-ээ claim хий, (2) Category/Min/Max/UOM шалгаж "Идэвхтэй" болго, (3) хэрэггүйг "Хасах"-д тэмдэглэ.');
    b.appendChild(myProgressBanner(dept));
    app.appendChild(b);
  }

  app.appendChild(mySummaryCard(dept));

  app.appendChild(exemplarCard());

  const unclaimedItems = state.items.filter(it=>!it.department);
  const uiCard = card(`1. Эзэмшигчгүй Item (${unclaimedItems.length})`, 'Алба нэгж тодорхойгүй бүх item эндээс харагдана. Өөрт хамаарахыг олж "Манай албаных" гэж ав. Улаан тэмдэгтэй нь эх файлд "хасах" гэж санал болгосон.');
  if(unclaimedItems.length===0){ uiCard.appendChild(el('div','empty','Эзэмшигчгүй item алга')); }
  else {
    const search = document.createElement('input'); search.type='text'; search.placeholder='Хайх (код/нэр)...'; search.style.width='100%'; search.style.marginBottom='10px';
    uiCard.appendChild(search);
    const listWrap = document.createElement('div'); uiCard.appendChild(listWrap);
    function drawItemList(filter){
      const f = norm(filter);
      const filtered = unclaimedItems.filter(it=> !f || norm(it.code).includes(f) || norm(it.name).includes(f));
      const t = document.createElement('table');
      t.innerHTML = '<tr><th>Код</th><th>Нэр</th><th>Санал (лавлагаа)</th><th>Төлөв</th><th></th></tr>' + filtered.slice(0,150).map(it=>{
        const removeTag = it.status==='remove_pending' ? '<span class="tag dup">Хасах санал</span>' : '';
        return `<tr><td style="font-family:var(--mono)">${escapeHtml(it.code)}</td><td>${escapeHtml(it.name)}</td><td class="link-note">${escapeHtml(it.suggested_department||'')}</td><td>${removeTag}</td><td><button class="btn small" data-id="${it.id}">Манай албаных</button></td></tr>`;
      }).join('');
      listWrap.innerHTML=''; listWrap.appendChild(t);
      t.querySelectorAll('button[data-id]').forEach(b=>{
        b.onclick = async ()=>{
          const item = state.items.find(x=>x.id===b.dataset.id);
          await dbUpdate('items', item.id, { department: dept });
          item.department = dept;
          render();
        };
      });
      if(filtered.length>150){ listWrap.appendChild(el('div','link-note',`+ дахин ${filtered.length-150} мөр, хайлтаа нарийсга`)); }
    }
    drawItemList('');
    search.oninput = ()=>drawItemList(search.value);
  }
  app.appendChild(uiCard);

  const myItems = state.items.filter(it=>it.department===dept);
  const miCard = card(`2. Миний Item-үүд — шалгаж баталгаажуулах (${myItems.length})`, 'Category/Min/Max/UOM зөв эсэхийг шалгаад "Идэвхтэй" болго, эсвэл хэрэггүйг "Хасах"/"Устгах" төлөвт шилжүүл.');
  if(myItems.length===0){ miCard.appendChild(el('div','empty','Одоогоор claim хийсэн item алга')); }
  myItems.forEach(it=>miCard.appendChild(renderItemReviewRow(it)));
  app.appendChild(miCard);
}

function renderItemReviewRow(it){
  const wrap = document.createElement('div');
  wrap.style.cssText='background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;';
  const head = document.createElement('div'); head.className='flex-between';
  head.innerHTML = `<div style="font-family:var(--mono);font-size:12px">${escapeHtml(it.code)} <span style="font-family:inherit">— ${escapeHtml(it.name)}</span></div>`;
  wrap.appendChild(head);
  if(it.note){ wrap.appendChild(el('div','link-note', 'Эх тайлбар: ' + it.note)); }

  const fi = document.createElement('div'); fi.className='field-inline';
  ['category','min','max','uom'].forEach(f=>{
    const lbl = document.createElement('label'); lbl.textContent = f.toUpperCase()+':';
    const inp = document.createElement('input'); inp.type='text'; inp.value = it[f]||'';
    inp.onchange = async ()=>{ it[f]=inp.value; await dbUpdate('items', it.id, {[f]: inp.value}); };
    fi.append(lbl, inp);
  });
  wrap.appendChild(fi);

  const statusRow = document.createElement('div'); statusRow.style.marginTop='8px'; statusRow.className='row';
  const statusLbl = document.createElement('span'); statusLbl.className='link-note'; statusLbl.textContent='Төлөв:';
  const statusSel = document.createElement('select');
  statusSel.innerHTML = `
    <option value="needs_review" ${it.status==='needs_review'?'selected':''}>Шалгагдаагүй</option>
    <option value="active" ${it.status==='active'?'selected':''}>Идэвхтэй (баталгаажсан)</option>
    <option value="remove_pending" ${it.status==='remove_pending'?'selected':''}>Хасах санал</option>
    <option value="removed" ${it.status==='removed'?'selected':''}>Устгах (баталгаажсан)</option>`;
  statusSel.onchange = async ()=>{
    const newStatus = statusSel.value;
    if(newStatus==='active'){
      const missing = ['category','min','max','uom'].filter(f=>!(it[f]&&it[f].toString().trim()));
      if(missing.length){
        toast('Идэвхтэй болгохын өмнө дараах талбарыг бөглөнө үү: ' + missing.join(', '));
        statusSel.value = it.status;
        return;
      }
    }
    it.status = newStatus;
    await dbUpdate('items', it.id, {status: newStatus});
    render();
  };
  statusRow.append(statusLbl, statusSel);
  wrap.appendChild(statusRow);

  // Oracle FBDI item fields (collapsible)
  const oracleToggle = document.createElement('button');
  oracleToggle.className='btn ghost small'; oracleToggle.style.marginTop='6px';
  oracleToggle.textContent='⚙ Oracle талбар (Org, Status, UOM...)';
  const oracleWrap = document.createElement('div');
  oracleWrap.style.cssText='display:none;margin-top:8px;padding:10px;background:var(--panel);border-radius:6px;';
  oracleToggle.onclick = ()=>{ oracleWrap.style.display = oracleWrap.style.display==='none'?'block':'none'; };
  const fields = [
    ['transaction_type','Transaction Type','select:Create,Sync'],
    ['org_code','Organization Code','text'],
    ['item_status','Item Status','select:Active,Inactive'],
    ['item_type','Item Type','text'],
    ['primary_uom','Primary UOM Code','text'],
    ['item_class','Item Class / Template','text'],
    ['source_system','Source System Code','text'],
  ];
  const grid = document.createElement('div'); grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;';
  fields.forEach(([key,label,type])=>{
    const fw = document.createElement('div');
    const lb = document.createElement('label'); lb.textContent=label; lb.style.cssText='font-size:11px;color:var(--sub);display:block;margin-bottom:2px;';
    let inp;
    if(type.startsWith('select:')){
      inp = document.createElement('select');
      const opts = type.split(':')[1].split(',');
      inp.innerHTML = '<option value="">--</option>' + opts.map(o=>`<option ${it[key]===o?'selected':''}>${o}</option>`).join('');
    } else {
      inp = document.createElement('input'); inp.type='text'; inp.value=it[key]||'';
    }
    inp.style.width='100%';
    inp.onchange = async ()=>{ it[key]=inp.value; await dbUpdate('items', it.id, {[key]: inp.value}); };
    fw.append(lb, inp);
    grid.appendChild(fw);
  });
  oracleWrap.appendChild(grid);
  wrap.appendChild(oracleToggle);
  wrap.appendChild(oracleWrap);
  return wrap;
}

function renderFatherAssetBlock(fa, dept){
  const block = document.createElement('div'); block.className='child-block';
  const head = document.createElement('div'); head.className='flex-between';
  head.innerHTML = `<div><strong>${escapeHtml(fa.name)}</strong> ${fa.code?`<span class="link-note">(${escapeHtml(fa.code)})</span>`:''}</div>`;
  const unclaimBtn = document.createElement('button'); unclaimBtn.className='btn ghost small'; unclaimBtn.textContent='Буцаах';
  unclaimBtn.onclick = async ()=>{ await dbUpdate('father_assets', fa.id, {department:null}); fa.department=null; render(); };
  head.appendChild(unclaimBtn);
  block.appendChild(head);

  const children = state.childAssets.filter(c=>c.father_id===fa.id);
  const childList = document.createElement('div'); childList.style.marginTop='8px';
  children.forEach(c=>childList.appendChild(renderChildAsset(c)));
  block.appendChild(childList);

  const addRow = document.createElement('div'); addRow.className='row'; addRow.style.marginTop='8px';
  const cName = document.createElement('input'); cName.type='text'; cName.placeholder='Child asset нэр'; cName.style.flex='1';
  const cQty = document.createElement('input'); cQty.type='number'; cQty.placeholder='тоо ш'; cQty.style.width='80px';
  const cBtn = document.createElement('button'); cBtn.className='btn small'; cBtn.textContent='+ Child нэмэх';
  cBtn.onclick = async ()=>{
    const nm = cName.value.trim(); if(!nm) return;
    const row = { id: uid(), father_id: fa.id, name: nm, qty: cQty.value||'', department: dept };
    await dbInsert('child_assets', row);
    state.childAssets.push(row);
    render();
  };
  addRow.append(cName, cQty, cBtn);
  block.appendChild(addRow);
  return block;
}

function renderChildAsset(c){
  const wrap = document.createElement('div');
  wrap.style.cssText='background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;';
  const head = document.createElement('div'); head.className='flex-between';
  head.innerHTML = `<div>▸ <strong>${escapeHtml(c.name)}</strong> ${c.qty?`<span class="link-note">x${escapeHtml(c.qty)}</span>`:''}</div>`;
  const rm = document.createElement('button'); rm.className='btn ghost small'; rm.textContent='Устгах';
  rm.onclick = async ()=>{
    await dbDelete('child_assets', c.id); // cascades links via FK
    state.childAssets = state.childAssets.filter(x=>x.id!==c.id);
    state.links = state.links.filter(l=>l.child_asset_id!==c.id);
    render();
  };
  head.appendChild(rm);
  wrap.appendChild(head);

  // Oracle FBDI fields (collapsible)
  const oracleToggle = document.createElement('button');
  oracleToggle.className='btn ghost small'; oracleToggle.style.marginTop='6px';
  oracleToggle.textContent='⚙ Oracle талбар (өртөг, элэгдэл, огноо...)';
  const oracleWrap = document.createElement('div');
  oracleWrap.style.cssText='display:none;margin-top:8px;padding:10px;background:var(--panel2);border-radius:6px;';
  oracleToggle.onclick = ()=>{ oracleWrap.style.display = oracleWrap.style.display==='none'?'block':'none'; };
  const oracleFields = [
    ['category','Asset Category (Oracle)','text'],
    ['date_in_service','Ашиглалтад орсон огноо (DD/MM/YYYY)','text'],
    ['asset_cost','Өртөг (Asset Cost)','text'],
    ['asset_type','Asset Type','select:Capitalized,CIP,Expensed'],
    ['deprn_method','Элэгдлийн арга','select:STL,Flat-Rate,Units of Production'],
    ['life_months','Ашиглалтын хугацаа (сар)','text'],
    ['location','Байршил (Location)','text'],
    ['criticality','Чухал түвшин','select:Өндөр,Дунд,Бага'],
    ['manufacturer','Manufacturer','text'],
    ['model','Model','text'],
    ['serial','Serial Number','text'],
  ];
  const grid = document.createElement('div'); grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;';
  oracleFields.forEach(([key,label,type])=>{
    const fw = document.createElement('div');
    const lb = document.createElement('label'); lb.textContent=label; lb.style.cssText='font-size:11px;color:var(--sub);display:block;margin-bottom:2px;';
    let inp;
    if(type.startsWith('select:')){
      inp = document.createElement('select');
      const opts = type.split(':')[1].split(',');
      inp.innerHTML = '<option value="">--</option>' + opts.map(o=>`<option ${c[key]===o?'selected':''}>${o}</option>`).join('');
    } else {
      inp = document.createElement('input'); inp.type='text'; inp.value=c[key]||'';
    }
    inp.style.width='100%';
    inp.onchange = async ()=>{ c[key]=inp.value; await dbUpdate('child_assets', c.id, {[key]: inp.value}); };
    fw.append(lb, inp);
    grid.appendChild(fw);
  });
  oracleWrap.appendChild(grid);
  wrap.appendChild(oracleToggle);
  wrap.appendChild(oracleWrap);
  links.forEach(l=>wrap.appendChild(renderItemLink(l)));

  const searchWrap = document.createElement('div'); searchWrap.className='search-box'; searchWrap.style.marginTop='6px';
  const sIn = document.createElement('input'); sIn.type='text'; sIn.placeholder='Item хайж холбох (код/нэр)...'; sIn.style.width='100%';
  const results = document.createElement('div'); results.className='search-results'; results.style.display='none';
  sIn.oninput = ()=>{
    const f = norm(sIn.value);
    if(!f){ results.style.display='none'; return; }
    const matches = state.items.filter(it=>it.status!=='removed' && (norm(it.code).includes(f)||norm(it.name).includes(f))).slice(0,20);
    results.innerHTML='';
    if(matches.length===0){ results.innerHTML='<div>Олдсонгүй</div>'; }
    matches.forEach(it=>{
      const d = document.createElement('div');
      d.textContent = `${it.code} — ${it.name}`;
      d.onclick = async ()=>{
        const row = { id: uid(), child_asset_id: c.id, item_id: it.id, qty:'', verified:false, corr_category:'', corr_min:'', corr_max:'', corr_uom:'' };
        await dbInsert('links', row);
        state.links.push(row);
        sIn.value=''; results.style.display='none'; render();
      };
      results.appendChild(d);
    });
    results.style.display='block';
  };
  searchWrap.append(sIn, results);
  wrap.appendChild(searchWrap);
  return wrap;
}

function renderItemLink(l){
  const it = state.items.find(x=>x.id===l.item_id);
  const wrap = document.createElement('div');
  wrap.style.cssText='background:var(--panel2);border-radius:6px;padding:8px 10px;margin:6px 0;';
  if(!it){ wrap.innerHTML = '<span class="link-note">Item олдсонгүй</span>'; return wrap; }
  const head = document.createElement('div'); head.className='flex-between';
  head.innerHTML = `<div style="font-family:var(--mono);font-size:12px">${escapeHtml(it.code)} <span style="font-family:inherit">— ${escapeHtml(it.name)}</span></div>`;
  const rmBtn = document.createElement('button'); rmBtn.className='btn ghost small'; rmBtn.textContent='×';
  rmBtn.onclick = async ()=>{ await dbDelete('links', l.id); state.links = state.links.filter(x=>x.id!==l.id); render(); };
  head.appendChild(rmBtn);
  wrap.appendChild(head);

  const fi = document.createElement('div'); fi.className='field-inline';
  const qtyLbl = document.createElement('label'); qtyLbl.textContent='Тоо ш:';
  const qtyIn = document.createElement('input'); qtyIn.type='number'; qtyIn.value=l.qty||'';
  qtyIn.onchange = async ()=>{ l.qty = qtyIn.value; await dbUpdate('links', l.id, {qty:l.qty}); };
  fi.append(qtyLbl, qtyIn);

  const fieldMap = { category:'corr_category', min:'corr_min', max:'corr_max', uom:'corr_uom' };
  Object.entries(fieldMap).forEach(([label, dbField])=>{
    const lbl = document.createElement('label'); lbl.textContent = label.toUpperCase()+':';
    const inp = document.createElement('input'); inp.type='text';
    inp.value = l[dbField] || it[label] || '';
    inp.onchange = async ()=>{ l[dbField] = inp.value; await dbUpdate('links', l.id, {[dbField]: inp.value}); };
    fi.append(lbl, inp);
  });
  wrap.appendChild(fi);

  const verifyRow = document.createElement('div'); verifyRow.style.marginTop='6px';
  const chk = document.createElement('label'); chk.style.fontSize='12px'; chk.style.cursor='pointer';
  const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=!!l.verified; cb.style.marginRight='6px';
  cb.onchange = async ()=>{ l.verified = cb.checked; await dbUpdate('links', l.id, {verified: l.verified}); render(); };
  chk.append(cb, document.createTextNode('Менежерээр баталгаажсан'));
  verifyRow.appendChild(chk);
  wrap.appendChild(verifyRow);
  return wrap;
}

// ================= MATRIX TAB =================
let matrixSelectedChildIds = [];
let matrixSelectedItemIds = [];

function renderMatrix(app){
  if(session.role==='manager'){
    state.currentDept = session.deptName;
    app.appendChild(card(`Ямар item, ямар asset-д хэдэн ширхэг ордог вэ? — ${session.deptName}`, 'Ижил төрлийн олон child asset-д зэрэг item тоо ширхэг оруулах. Жишээ: 3 ижил насосонд ямар сэлбэг хэд ордгийг нэг дор бөглөнө.'));
  } else {
    const sel = card('Ямар item, ямар asset-д хэдэн ширхэг ордог вэ?', 'Алба нэгжээ сонгоод, ижил төрлийн олон child asset-д зэрэг item тоо ширхэг оруулна.');
    const row = document.createElement('div'); row.className='row';
    const s = document.createElement('select'); s.style.minWidth='260px';
    s.innerHTML = '<option value="">-- сонгох --</option>' + state.departments.map(d=>`<option ${state.currentDept===d.name?'selected':''} value="${escapeHtml(d.name)}">${escapeHtml(d.name)}</option>`).join('');
    s.onchange = ()=>{ state.currentDept = s.value || null; matrixSelectedChildIds=[]; matrixSelectedItemIds=[]; render(); };
    row.appendChild(s);
    sel.appendChild(row);
    app.appendChild(sel);
  }

  if(!state.currentDept){
    app.appendChild(el('div','empty','Ажиллах алба нэгжээ сонгоно уу'));
    return;
  }
  const dept = state.currentDept;
  const myChildren = state.childAssets.filter(c=>c.department===dept);

  // Step 1: pick child assets (columns)
  const colCard = card('1. Ижил төрлийн Child Asset-уудаа сонго (баганууд болно)', '');
  if(myChildren.length===0){ colCard.appendChild(el('div','empty','Эхлээд "Алба нэгжийн ажил" табд child asset задлана уу')); app.appendChild(colCard); return; }
  const colGrid = document.createElement('div'); colGrid.style.cssText='display:flex;flex-wrap:wrap;gap:6px;';
  myChildren.forEach(c=>{
    const lbl = document.createElement('label');
    lbl.style.cssText='display:flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked = matrixSelectedChildIds.includes(c.id);
    cb.onchange = ()=>{
      if(cb.checked) matrixSelectedChildIds.push(c.id);
      else matrixSelectedChildIds = matrixSelectedChildIds.filter(x=>x!==c.id);
      render();
    };
    lbl.append(cb, document.createTextNode(c.name));
    colGrid.appendChild(lbl);
  });
  colCard.appendChild(colGrid);
  app.appendChild(colCard);

  if(matrixSelectedChildIds.length===0){
    app.appendChild(el('div','empty','Дор хаяж 1 child asset сонгоно уу'));
    return;
  }

  // Step 2: pick items (rows) via search
  const itemCard = card('2. Item-үүдээ хайж мөр болгон нэм', '');
  const searchWrap = document.createElement('div'); searchWrap.className='search-box';
  const sIn = document.createElement('input'); sIn.type='text'; sIn.placeholder='Item хайх (код/нэр)...'; sIn.style.width='100%';
  const results = document.createElement('div'); results.className='search-results'; results.style.display='none';
  sIn.oninput = ()=>{
    const f = norm(sIn.value);
    if(!f){ results.style.display='none'; return; }
    const matches = state.items.filter(it=>it.status!=='removed' && (norm(it.code).includes(f)||norm(it.name).includes(f))).slice(0,20);
    results.innerHTML='';
    if(matches.length===0){ results.innerHTML='<div>Олдсонгүй</div>'; }
    matches.forEach(it=>{
      const d = document.createElement('div');
      d.textContent = `${it.code} — ${it.name}`;
      d.onclick = ()=>{
        if(!matrixSelectedItemIds.includes(it.id)) matrixSelectedItemIds.push(it.id);
        sIn.value=''; results.style.display='none'; render();
      };
      results.appendChild(d);
    });
    results.style.display='block';
  };
  searchWrap.append(sIn, results);
  itemCard.appendChild(searchWrap);
  app.appendChild(itemCard);

  if(matrixSelectedItemIds.length===0){
    app.appendChild(el('div','empty','Дор хаяж 1 item хайж нэмнэ үү'));
    return;
  }

  // Step 3: matrix grid
  const gridCard = card('3. Тоо ширхэгээ бөглөнө үү', 'Хоосон = холбоогүй. Утга оруулбал автоматаар хадгална.');
  const table = document.createElement('table');
  const selectedChildren = myChildren.filter(c=>matrixSelectedChildIds.includes(c.id));
  const selectedItems = state.items.filter(it=>matrixSelectedItemIds.includes(it.id));

  let thead = '<tr><th>Item</th>' + selectedChildren.map(c=>`<th>${escapeHtml(c.name)}</th>`).join('') + '<th></th></tr>';
  table.innerHTML = thead;
  selectedItems.forEach(it=>{
    const tr = document.createElement('tr');
    const tdName = document.createElement('td');
    tdName.innerHTML = `<span style="font-family:var(--mono);font-size:11px">${escapeHtml(it.code)}</span><br>${escapeHtml(it.name)}`;
    tr.appendChild(tdName);
    selectedChildren.forEach(c=>{
      const td = document.createElement('td');
      const existing = state.links.find(l=>l.child_asset_id===c.id && l.item_id===it.id);
      const inp = document.createElement('input');
      inp.type = 'number'; inp.style.width='60px';
      inp.value = existing ? (existing.qty||'') : '';
      inp.placeholder = '—';
      inp.onchange = async ()=>{
        const val = inp.value.trim();
        let link = state.links.find(l=>l.child_asset_id===c.id && l.item_id===it.id);
        if(!val){
          if(link){ await dbDelete('links', link.id); state.links = state.links.filter(x=>x.id!==link.id); }
          return;
        }
        if(link){
          link.qty = val;
          await dbUpdate('links', link.id, {qty: val});
        } else {
          const row = { id: uid(), child_asset_id: c.id, item_id: it.id, qty: val, verified:false, corr_category:'', corr_min:'', corr_max:'', corr_uom:'' };
          await dbInsert('links', row);
          state.links.push(row);
        }
      };
      td.appendChild(inp);
      tr.appendChild(td);
    });
    const tdRm = document.createElement('td');
    const rmBtn = document.createElement('button'); rmBtn.className='btn ghost small'; rmBtn.textContent='×';
    rmBtn.title = 'Мөрнөөс хасах (холбоог устгахгүй)';
    rmBtn.onclick = ()=>{ matrixSelectedItemIds = matrixSelectedItemIds.filter(x=>x!==it.id); render(); };
    tdRm.appendChild(rmBtn);
    tr.appendChild(tdRm);
    table.appendChild(tr);
  });
  gridCard.appendChild(table);
  app.appendChild(gridCard);
}

// ================= EXPORT TAB =================
function renderExport(app){
  const dept = session.role==='manager' ? session.deptName : (state.currentDept||null);

  // ---- Manager: өөрийн алба нэгжийн export ----
  if(session.role==='manager' || dept){
    const targetDept = dept;
    const myFather = state.fatherAssets.filter(a=>a.department===targetDept);
    const myChildren = state.childAssets.filter(c=>c.department===targetDept);
    const myChildIds = myChildren.map(c=>c.id);
    const myItems = state.items.filter(it=>it.department===targetDept);
    const myLinks = state.links.filter(l=>myChildIds.includes(l.child_asset_id));

    const myExp = card(`📥 ${targetDept||''} — Миний дата татах`, 'Өөрийн алба нэгжийн Asset, Child asset, Item жагсаалтыг татна.');

    // Asset export
    const b1 = document.createElement('button'); b1.className='btn'; b1.style.marginRight='8px';
    b1.textContent=`Father Asset (${myFather.length}) татах`;
    b1.onclick=()=>{
      const rows=[['Asset Number','Asset Description','Department']];
      myFather.forEach(a=>rows.push([a.code,a.name,a.department||'']));
      downloadCsv(rows,`${targetDept||'my'}-father-assets.csv`);
    };

    // Child asset export
    const b2 = document.createElement('button'); b2.className='btn'; b2.style.marginRight='8px';
    b2.textContent=`Child Asset (${myChildren.length}) татах`;
    b2.onclick=()=>{
      const rows=[['Father Asset Code','Father Asset Name','Child Asset','Тоо ш','Criticality','Category','Date In Service','Asset Cost','Asset Type','Deprn Method','Life Months','Location','Manufacturer','Model','Serial']];
      myChildren.forEach(c=>{
        const fa=state.fatherAssets.find(x=>x.id===c.father_id);
        rows.push([fa?fa.code:'',fa?fa.name:'',c.name,c.qty||'',c.criticality||'',c.category||'',c.date_in_service||'',c.asset_cost||'',c.asset_type||'',c.deprn_method||'',c.life_months||'',c.location||'',c.manufacturer||'',c.model||'',c.serial||'']);
      });
      downloadCsv(rows,`${targetDept||'my'}-child-assets.csv`);
    };

    // Item export
    const b3 = document.createElement('button'); b3.className='btn secondary'; b3.style.marginRight='8px';
    b3.textContent=`Item/Spare parts (${myItems.length}) татах`;
    b3.onclick=()=>{
      const statusLabel={active:'Идэвхтэй',removed:'Устгасан',remove_pending:'Хасах санал',needs_review:'Шалгагдаагүй'};
      const rows=[['Item Code','Item Name','Category','Min','Max','UOM','Status','Note']];
      myItems.forEach(it=>rows.push([it.code,it.name,it.category||'',it.min||'',it.max||'',it.uom||'',statusLabel[it.status]||it.status,it.note||'']));
      downloadCsv(rows,`${targetDept||'my'}-items.csv`);
    };

    // Item-Asset link export
    const b4 = document.createElement('button'); b4.className='btn secondary';
    b4.textContent=`Item↔Asset холболт (${myLinks.length}) татах`;
    b4.onclick=()=>{
      const rows=[['Child Asset','Father Asset','Item Code','Item Name','Category','Min','Max','UOM','Тоо ш','Баталгаажсан']];
      myLinks.forEach(l=>{
        const c=state.childAssets.find(x=>x.id===l.child_asset_id);
        const fa=c?state.fatherAssets.find(x=>x.id===c.father_id):null;
        const it=state.items.find(x=>x.id===l.item_id);
        if(!c||!it) return;
        rows.push([c.name,fa?fa.name:'',it.code,it.name,l.corr_category||it.category||'',l.corr_min||it.min||'',l.corr_max||it.max||'',l.corr_uom||it.uom||'',l.qty||'',l.verified?'Тийм':'Үгүй']);
      });
      downloadCsv(rows,`${targetDept||'my'}-item-links.csv`);
    };

    const btnRow = document.createElement('div'); btnRow.style.display='flex'; btnRow.style.flexWrap='wrap'; btnRow.style.gap='8px';
    btnRow.append(b1,b2,b3,b4);
    myExp.appendChild(btnRow);
    app.appendChild(myExp);
  }

  // Admin-д нэмэлт export боломж
  if(session.role==='admin'){
    // Dept picker for admin
    if(!dept){
      const sel = card('Алба нэгжийн export-д алба нэгж сонгоно уу','');
      const s=document.createElement('select'); s.style.minWidth='200px';
      s.innerHTML='<option value="">-- сонгох --</option>'+state.departments.map(d=>`<option value="${escapeHtml(d.name)}">${escapeHtml(d.name)}</option>`).join('');
      s.onchange=()=>{state.currentDept=s.value||null; render();};
      sel.appendChild(s); app.appendChild(sel);
    }
    // Global exports (admin only)
    const c1 = card('Бүх Asset жагсаалт (нийт)', 'Father + Child asset бүгд.');
    const b1g = document.createElement('button'); b1g.className='btn'; b1g.textContent='CSV татах';
    b1g.onclick = ()=>{
      const rows = [['Father Code','Father Name','Department','Child Asset','Child Qty']];
      state.fatherAssets.forEach(fa=>{
        const children = state.childAssets.filter(c=>c.father_id===fa.id);
        if(children.length===0){ rows.push([fa.code, fa.name, fa.department||'', '', '']); }
        children.forEach(c=> rows.push([fa.code, fa.name, fa.department||'', c.name, c.qty||'']));
      });
      downloadCsv(rows, 'all-asset-structure.csv');
    };
    c1.appendChild(b1g); app.appendChild(c1);

  const c2 = card('Item холболт экспорт', 'Child asset тус бүрт хамаарах item, тоо ширхэг, баталгаажсан категори/min/max/UOM. Зөвхөн "Идэвхтэй" төлөвтэй item орно (Устгах/Хасах санал орохгүй).');
  const b2 = document.createElement('button'); b2.className='btn'; b2.textContent='CSV татах';
  b2.onclick = ()=>{
    const rows = [['Department','Father Asset','Child Asset','Item Code','Item Name','Category','Min','Max','UOM','Link Qty','Verified']];
    state.links.forEach(l=>{
      const c = state.childAssets.find(x=>x.id===l.child_asset_id);
      const fa = c ? state.fatherAssets.find(x=>x.id===c.father_id) : null;
      const it = state.items.find(x=>x.id===l.item_id);
      if(!c||!it) return;
      if(it.status==='removed' || it.status==='remove_pending') return;
      rows.push([fa?fa.department||'':'', fa?fa.name:'', c.name, it.code, it.name,
        l.corr_category||it.category, l.corr_min||it.min, l.corr_max||it.max, l.corr_uom||it.uom,
        l.qty||'', l.verified?'Yes':'No']);
    });
    downloadCsv(rows, 'item-links.csv');
  };
  c2.appendChild(b2);
  app.appendChild(c2);

  const c2b = card('Item Master эцсийн жагсаалт', 'Бүх item, тэдгээрийн эцсийн төлөв (Идэвхтэй/Устгах/Шалгагдаагүй) — Oracle-д ачаалахын өмнө "Шалгагдаагүй" мөр байхгүй эсэхийг шалгана уу.');
  const b2b = document.createElement('button'); b2b.className='btn'; b2b.textContent='CSV татах';
  b2b.onclick = ()=>{
    const rows = [['Item Code','Item Name','Category','Min','Max','UOM','Department','Status','Note']];
    const statusLabel = {active:'Идэвхтэй', removed:'Устгасан', remove_pending:'Хасах санал', needs_review:'Шалгагдаагүй'};
    state.items.forEach(it=>{
      rows.push([it.code, it.name, it.category, it.min, it.max, it.uom, it.department||'', statusLabel[it.status]||it.status, it.note||'']);
    });

  };
  c2b.appendChild(b2b);
  app.appendChild(c2b);

  // ---- Oracle FBDI ready exports ----
  const cFA = card('⬇ Oracle FBDI — Asset (FA_MASS_ADDITIONS)', 'Child asset тус бүрийг Oracle FA Mass Additions баганаар. Гана эцэст нь санхүүгийн дутуу утгыг нөхөж, Oracle FBDI .xlsm-д хуулна.');
  const bFA = document.createElement('button'); bFA.className='btn'; bFA.textContent='Oracle Asset CSV татах';
  bFA.onclick = ()=>{
    const rows = [['ASSET_NUMBER','DESCRIPTION','ASSET_CATEGORY','DATE_PLACED_IN_SERVICE','ASSET_COST','ASSET_TYPE','DEPRN_METHOD','LIFE_IN_MONTHS','LOCATION','UNITS','CRITICALITY','MANUFACTURER','MODEL','SERIAL_NUMBER','DEPARTMENT','PARENT_ASSET']];
    state.childAssets.forEach(c=>{
      const fa = state.fatherAssets.find(x=>x.id===c.father_id);
      rows.push(['', c.name, c.category||'', c.date_in_service||'', c.asset_cost||'', c.asset_type||'', c.deprn_method||'', c.life_months||'', c.location||'', c.qty||'1', c.criticality||'', c.manufacturer||'', c.model||'', c.serial||'', c.department||'', fa?fa.name:'']);
    });
    downloadCsv(rows, 'oracle-fa-mass-additions.csv');
  };
  cFA.appendChild(bFA);
  app.appendChild(cFA);

  const cIT = card('⬇ Oracle FBDI — Item (EGP_SYSTEM_ITEMS)', 'Зөвхөн "Идэвхтэй" item-ийг Oracle Item Import баганаар. Устгах/Хасах санал орохгүй.');
  const bIT = document.createElement('button'); bIT.className='btn'; bIT.textContent='Oracle Item CSV татах';
  bIT.onclick = ()=>{
    const rows = [['TRANSACTION_TYPE','ORGANIZATION_CODE','ITEM_NUMBER','DESCRIPTION','ITEM_STATUS','ITEM_TYPE','PRIMARY_UOM_CODE','ITEM_CLASS','SOURCE_SYSTEM_CODE','CATEGORY','MIN_QTY','MAX_QTY','DEPARTMENT']];
    state.items.forEach(it=>{
      if(it.status!=='active') return;
      rows.push([it.transaction_type||'Create', it.org_code||'MMC', it.code, it.name, it.item_status||'Active', it.item_type||'', it.primary_uom||it.uom||'', it.item_class||'', it.source_system||'Legacy', it.category||'', it.min||'', it.max||'', it.department||'']);
    });
    downloadCsv(rows, 'oracle-item-import.csv');
  };
  cIT.appendChild(bIT);
  app.appendChild(cIT);

  const c3 = card('Давхардсан item тайлан', 'Ижил нэртэй боловч өөр код-той item-ийн бүлгүүд.');
  const b3 = document.createElement('button'); b3.className='btn secondary'; b3.textContent='CSV татах';
  b3.onclick = ()=>{
    const groups = {};
    state.items.forEach(it=>{ const k = norm(it.name); (groups[k]=groups[k]||[]).push(it); });
    const rows = [['Нэр','Кодууд','Тоо']];
    Object.values(groups).filter(g=>g.length>1).forEach(g=> rows.push([g[0].name, g.map(x=>x.code).join(' | '), g.length]));
    downloadCsv(rows, 'duplicate-items.csv');
  };
  c3.appendChild(b3);
  app.appendChild(c3);
  } // end admin section
}

function downloadCsv(rows, filename){
  const csv = rows.map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

function card(title, desc){
  const c = document.createElement('div'); c.className='card';
  const h = document.createElement('h2'); h.textContent = title; c.appendChild(h);
  if(desc){ const d = document.createElement('div'); d.className='desc'; d.textContent = desc; c.appendChild(d); }
  return c;
}
function el(tag, cls, text){ const e = document.createElement(tag); e.className=cls; e.textContent=text; return e; }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

loadAll();
