// UNSPSC category lookup from item code (first 8 digits)
function getUnspsc(itemCode){
  if(!itemCode || typeof UNSPSC === 'undefined') return null;
  const code = itemCode.toString().trim().replace(/\D/g,'');
  if(code.length < 8) return null;
  const com8 = code.slice(0,8);
  const cls6 = com8.slice(0,6);
  const fam4 = com8.slice(0,4);
  const seg2 = com8.slice(0,2);
  return {
    segment: UNSPSC.s[seg2] || '',
    family:  UNSPSC.f[fam4] || '',
    cls:     UNSPSC.c[cls6] || '',
    commodity: UNSPSC.com[com8] || '',
    codes: { seg2, fam4, cls6, com8 }
  };
}

function unspscBadge(itemCode){
  const u = getUnspsc(itemCode);
  if(!u || !u.commodity) return '';
  return `<div style="margin-top:4px;font-size:11px;background:var(--panel);padding:4px 8px;border-radius:4px;border-left:3px solid var(--accent2)">
    <span style="color:var(--sub)">UNSPSC: </span>
    <span style="color:var(--sub)">${escapeHtml(u.segment)}</span>
    <span style="color:var(--sub)"> › </span>
    <span style="color:var(--sub)">${escapeHtml(u.family)}</span>
    <span style="color:var(--sub)"> › </span>
    <span style="color:var(--sub)">${escapeHtml(u.cls)}</span>
    <span style="color:var(--sub)"> › </span>
    <span style="color:var(--accent2);font-weight:600">${escapeHtml(u.commodity)}</span>
  </div>`;
}

// ---------- SUPABASE DATA LAYER ----------
async function loadAll(){
  if(!sb){ renderSetupScreen(); return; }
  try{
    const [d,f,c,i,l] = await Promise.all([
      sb.from('departments').select('*'),
      sb.from('father_assets').select('*'),
      sb.from('child_assets').select('*'),
      sb.from('items').select('*'),
      sb.from('links').select('*'),
    ]);
    for(const r of [d,f,c,i,l]){ if(r.error) throw r.error; }
    state.departments = (d.data || []).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    state.fatherAssets = f.data || [];
    state.childAssets = c.data || [];
    state.items = i.data || [];
    state.links = l.data || [];
    connOk = true;
  }catch(e){
    console.error(e);
    connOk = false;
    toast('Supabase холболтын алдаа: ' + e.message);
  }
  updateConnBadge();
  render();
}
function updateConnBadge(){
  const b = document.getElementById('connBadge');
  if(!sb){ b.textContent = 'Тохируулаагүй'; b.className = 'conn-badge conn-bad'; return; }
  b.textContent = connOk ? 'Холбогдсон' : 'Холболтын алдаа';
  b.className = 'conn-badge ' + (connOk ? 'conn-ok' : 'conn-bad');
}

async function dbInsert(table, row){
  const { error } = await sb.from(table).insert(row);
  if(error){ toast('Алдаа: '+error.message); throw error; }
}
async function dbUpdate(table, id, patch){
  const { error } = await sb.from(table).update(patch).eq('id', id);
  if(error){ toast('Алдаа: '+error.message); throw error; }
}
async function dbDelete(table, id){
  const { error } = await sb.from(table).delete().eq('id', id);
  if(error){ toast('Алдаа: '+error.message); throw error; }
}
async function dbDeleteMatch(table, col, val){
  const { error } = await sb.from(table).delete().eq(col, val);
  if(error){ toast('Алдаа: '+error.message); throw error; }
}

  const wrap = document.createElement('div');
  wrap.style.cssText = 'max-width:440px;margin:50px auto;';

      const btn = document.createElement('button'); btn.className='btn'; btn.textContent='Нэвтрэх'; btn.style.width='100%';
      const err = document.createElement('div'); err.className='desc'; err.style.color='var(--danger)';
      btn.onclick = ()=>{
        const dname = deptSel.value;
        if(!dname){ err.textContent='Алба нэгжээ сонгоно уу'; return; }

        session = { role:'manager', deptName:dname };

      const pwd = document.createElement('input'); pwd.type='password'; pwd.placeholder='Админ нууц үг'; pwd.style.cssText='width:100%;margin-bottom:10px;';
      const btn = document.createElement('button'); btn.className='btn'; btn.textContent='Нэвтрэх'; btn.style.width='100%';
      const err = document.createElement('div'); err.className='desc'; err.style.color='var(--danger)';
      btn.onclick = ()=>{

        session = { role:'admin', deptName:null };
        saveSession();
        state.currentTab = 'admin';
        render();
      };
      pwd.onkeydown = e=>{ if(e.key==='Enter') btn.click(); };
      formWrap.append(pwd, btn, err);
    }
  }
  drawForm();
  wrap.appendChild(c);

// ---------- NAV ----------
function renderNav(){
  const nav = document.getElementById('navBar');
  nav.innerHTML = '';
  let tabs;
  if(session.role==='admin'){
    tabs = [['admin','Ерөнхий/Тохиргоо'],['asset','Asset шалгах'],['item','Item шалгах'],['matrix','Item↔Asset холбох'],['export','Экспорт'],['guide','Заавар']];
  } else {
    tabs = [['asset','Asset шалгах'],['item','Item (Spare parts) шалгах'],['matrix','Item↔Asset холбох'],['export','Экспорт'],['guide','Заавар']];
  }
  tabs.forEach(([key,label])=>{
    const b = document.createElement('button');
    b.textContent = label;
    b.className = state.currentTab===key ? 'active':'';
    b.onclick = ()=>{ state.currentTab=key; render(); };
    nav.appendChild(b);
  });
  // logout button
  const lo = document.createElement('button');
  lo.className = 'logout-btn';
  lo.innerHTML = `<span style="opacity:.7">${session.role==='admin'?'Админ':session.deptName}</span> · Гарах`;
  lo.style.marginLeft = '8px';
  lo.onclick = ()=>{ if(confirm('Гарах уу?')){ session={role:null,deptName:null}; saveSession(); state.currentDept=null; render(); } };
  nav.appendChild(lo);
}

function renderSetupScreen(){
  updateConnBadge();
  const app = document.getElementById('app');
  app.innerHTML = '';
  document.getElementById('navBar').innerHTML = '';
  const wrap = document.createElement('div'); wrap.className='setup-screen';
  wrap.innerHTML = `<h2>Supabase холболт тохируулаагүй байна</h2>
    <p class="desc">index.html файлын эхэнд байгаа <b>SUPABASE_ANON_KEY</b> утгыг
    Supabase Dashboard -> Settings -> API Keys хэсгийн <b>"anon public"</b> key-ээр солиод дахин deploy хийнэ үү. (SUPABASE_URL аль хэдийн бичигдсэн.)</p>`;
  app.appendChild(wrap);
}

// ---------- RENDER ROOT ----------
function render(){
  if(!sb){ renderSetupScreen(); return; }
  if(!session.role){ renderLogin(); return; }
  renderNav();
  updateConnBadge();
  const app = document.getElementById('app');
  app.innerHTML = '';
  // managers can't access admin tabs
  if(session.role==='manager' && state.currentTab==='admin'){
    state.currentTab = 'asset';
  }
  // migrate old 'work' tab to new 'asset'
  if(state.currentTab==='work') state.currentTab = 'asset';
  if(state.currentTab==='admin') renderAdmin(app);
  else if(state.currentTab==='asset') renderAssetTab(app);
  else if(state.currentTab==='item') renderItemTab(app);
  else if(state.currentTab==='matrix') renderMatrix(app);
  else if(state.currentTab==='guide') renderGuide(app);
  else renderExport(app);
}

function deptProgressStatus(deptName){
  const f = state.fatherAssets.filter(a=>a.department===deptName);
  const cList = state.childAssets.filter(x=>x.department===deptName);
  const cIds = cList.map(x=>x.id);
  const myItems = state.items.filter(it=>it.department===deptName);
  const activeItems = myItems.filter(it=>it.status==='active' || it.status==='removed');
  const links = state.links.filter(x=>cIds.includes(x.child_asset_id));
  return {
    assetClaimed: f.length,
    childDone: cList.length,
    itemClaimed: myItems.length,
    itemReviewed: activeItems.length,
    linksMade: links.length,
    // step completion booleans
    step1: f.length>0,                                   // Asset claim
    step2: cList.length>0,                                // Child задлах
    step3: myItems.length>0,                              // Item claim
    step4: myItems.length>0 && activeItems.length===myItems.length,  // бүх item шалгасан
    step5: links.length>0,                               // Item-Asset холбосон
  };
}

async function handleCsvImport(e, kind){
  const file = e.target.files[0];
  if(!file) return;
  Papa.parse(file, { header:true, skipEmptyLines:true, complete: async (res)=>{
    const cols = res.meta.fields || [];
    openColumnMapModal(kind, cols, res.data);
  }});
}

function openColumnMapModal(kind, cols, rows){

        ['name','Нэр (Asset Description)'],
        ['assetGroup','Asset Group'],
        ['assetGroupDesc','Asset Group Description'],
        ['assetCategory','Asset Category'],
        ['processArea','Process Area'],
        ['department','Санал болгож буй алба нэгж → автоматаар хуваарилна'],
      ]
    : [
        ['code','Код (Item Code)'],
        ['name','Анхны нэр'],
        ['revisedName','Зассан нэр (заавал биш)'],
        ['spec','Үзүүлэлт / Spec (заавал биш)'],
        ['equipment','Тоноглол / Equipment (заавал биш)'],
        ['uom','UOM'],
        ['min','Min Qty'],
        ['max','Max Qty'],
        ['criticality','Чухал түвшин (заавал биш)'],
        ['department','Санал болгож буй алба нэгж → автоматаар хуваарилна'],
        ['note','Тайлбар (заавал биш)'],
      ];
  const bg = document.createElement('div'); bg.className='modal-bg';
  const modal = document.createElement('div'); modal.className='modal';
  modal.style.maxHeight='80vh'; modal.style.overflowY='auto';
  modal.innerHTML = `<h3>${kind==='father'?'Father Asset':'Item'} багана харгалзуулах</h3>
    <div class="desc">CSV-ийн ямар багана юу болохыг сонгоно уу. (${rows.length} мөр)</div>`;
  const selects = {};
  const guessMap = {
    code: ['asset number','item code','number','код','code'],
    name: ['asset description','анхны нэр','description','нэр','name'],
    revisedName: ['зассан нэр','revised','corrected'],
    spec: ['үзүүлэлт','spec','parameter','параметр'],
    equipment: ['тоноглол','equipment','asset','хамаарах'],
    assetGroup: ['asset group','group','бүлэг'],
    assetGroupDesc: ['group description','group desc','бүлгийн тайлбар'],
    assetCategory: ['asset category','category','ангилал'],
    processArea: ['process area','process','байршил','талбай'],
    department: ['санал болгож','алба нэгж','department','хариуцах','хуваарилах'],
    min: ['min qty','min','хамгийн бага'],
    max: ['max qty','max','хамгийн их'],
    uom: ['uom','unit','нэгж'],
    criticality: ['чухал','criticality','priority','зэрэглэл'],
    note: ['тайлбар','note','comment'],
  };
  fields.forEach(([key,label])=>{
    const colDiv = document.createElement('div'); colDiv.className='col';
    colDiv.innerHTML = `<label>${label}</label>`;
    const sel = document.createElement('select');
    sel.innerHTML = '<option value="">-- сонгох --</option>' + cols.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    const keywords = guessMap[key]||[key];
    const guess = cols.find(c=>keywords.some(k=>norm(c).includes(k)));

    colDiv.appendChild(sel);

const REMOVE_KEYWORDS = ["хасах","давхард","хэрэглэхгүй","утгах","байхгүй","ашиглахгүй","шаардлагагүй"];
function detectStatus(note){
  const n = norm(note);
  if(!n) return 'needs_review';
  return REMOVE_KEYWORDS.some(k=>n.includes(k)) ? 'remove_pending' : 'needs_review';
}

async function runImport(kind, mapping, rows){
  // Warn users about import
  const confirmed = confirm(`⚠️ ${kind==='father'?'Father Asset':'Item'} импортлох гэж байна!\n\nЭнэ хугацаанд бусад эзэмшигчид ашиглахгүйгээр хүлээнэ үү.\n\nҮргэлжүүлэх үү?\n\n(${rows.length} мөр орох ёстой)`);
  if(!confirmed) return;

  // Disable all import buttons during import
  document.querySelectorAll('input[type="file"]').forEach(f=>f.disabled=true);
  document.querySelectorAll('button').forEach(b=>{ if(b.textContent.includes('Импортлох')) b.disabled=true; });

  const BATCH = 300;
  if(kind==='father'){
    const existingCodes = new Set(state.fatherAssets.map(a=>a.code));
    const toInsert = [];
    rows.forEach(r=>{
      const code = (r[mapping.code]||'').toString().trim();
      const name = (r[mapping.name]||'').toString().trim();
      if(!code || existingCodes.has(code)) return;
      const suggestedRaw = mapping.department ? (r[mapping.department]||'').toString().trim() : '';
      const matchedDept = state.departments.find(d=>norm(d.name)===norm(suggestedRaw));
      toInsert.push({
        id: uid(), code, name,
        asset_group: mapping.assetGroup ? (r[mapping.assetGroup]||'').toString().trim() : '',
        asset_group_desc: mapping.assetGroupDesc ? (r[mapping.assetGroupDesc]||'').toString().trim() : '',
        asset_category: mapping.assetCategory ? (r[mapping.assetCategory]||'').toString().trim() : '',
        process_area: mapping.processArea ? (r[mapping.processArea]||'').toString().trim() : '',
        department: matchedDept ? matchedDept.name : null,
        source: 'import',
      });
      existingCodes.add(code);
    });
    let imported=0;
    for(let i=0;i<toInsert.length;i+=BATCH){
      const chunk = toInsert.slice(i,i+BATCH);
      const { error } = await sb.from('father_assets').insert(chunk);
      if(error){ toast('Импортын алдаа: '+error.message); break; }
      state.fatherAssets.push(...chunk);
      imported+=chunk.length;
    }
    const assigned = toInsert.filter(x=>x.department).length;
    const unassigned = toInsert.length - assigned;
    toast(`${imported} father asset импортлогдлоо (${assigned} хуваарилагдсан, ${unassigned} хуваарилагдаагүй)`);
  } else {
    const existingCodes = new Set(state.items.map(i=>i.code));
    const toInsert = [];
    rows.forEach(r=>{
      const code = (r[mapping.code]||'').toString().trim();
      const name = (r[mapping.name]||'').toString().trim();
      if(!code || existingCodes.has(code)) return;
      const note = mapping.note ? (r[mapping.note]||'').toString().trim() : '';
      const suggestedRaw = mapping.department ? (r[mapping.department]||'').toString().trim() : '';
      const matchedDept = state.departments.find(d=>norm(d.name)===norm(suggestedRaw));
      toInsert.push({
        id: uid(), code, name,
        revised_name: mapping.revisedName ? (r[mapping.revisedName]||'').toString().trim() : '',
        spec: mapping.spec ? (r[mapping.spec]||'').toString().trim() : '',
        equipment: mapping.equipment ? (r[mapping.equipment]||'').toString().trim() : '',
        uom: mapping.uom ? (r[mapping.uom]||'').toString().trim() : '',
        min: mapping.min ? (r[mapping.min]||'').toString().trim() : '',
        max: mapping.max ? (r[mapping.max]||'').toString().trim() : '',
        criticality: mapping.criticality ? (r[mapping.criticality]||'').toString().trim() : '',
        department: matchedDept ? matchedDept.name : null,
        suggested_department: suggestedRaw,
        status: detectStatus(note),
        note: note,
        transaction_type: 'Create',
        org_code: 'MMC',
        item_status: 'Active',
        source_system: 'Legacy',
      });
      existingCodes.add(code);
    });
    let imported=0;
    for(let i=0;i<toInsert.length;i+=BATCH){
      const chunk = toInsert.slice(i,i+BATCH);
      const { error } = await sb.from('items').insert(chunk);
      if(error){ toast('❌ Импортын алдаа: '+error.message); break; }
      state.items.push(...chunk);
      imported+=chunk.length;
    }
    const activeI = toInsert.filter(x=>x.status==='active').length;
    const skipDuplicates = rows.length - toInsert.length;
    const msg = skipDuplicates > 0 
      ? `✅ ${imported} item импортлогдлоо. ${skipDuplicates} давхарлал алгаалагдсан.`
      : `✅ ${imported} item импортлогдлоо`;
    toast(msg);
  }
  render();
}

function ensureDept(app, subtitle){
  if(session.role==='manager'){
    state.currentDept = session.deptName;
    return true;
  }
  const sel = card('Алба нэгжээ сонгоно уу', subtitle||'Дараа нь тухайн алба нэгжийн ажлыг гүйцэтгэнэ.');
  const row = document.createElement('div'); row.className='row';
  const s = document.createElement('select'); s.style.minWidth='260px';
  s.innerHTML = '<option value="">-- сонгох --</option>' + state.departments.map(d=>`<option ${state.currentDept===d.name?'selected':''} value="${escapeHtml(d.name)}">${escapeHtml(d.name)}</option>`).join('');
  s.onchange = ()=>{ state.currentDept = s.value || null; render(); };
  row.appendChild(s);
  sel.appendChild(row);
  app.appendChild(sel);
  if(!state.currentDept){
    app.appendChild(el('div','empty','Ажиллах алба нэгжээ сонгоно уу'));
    return false;
  }
  return true;
}

function myProgressBanner(deptName){
  const s = deptProgressStatus(deptName);
  const wrap = document.createElement('div');
  wrap.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;';
  const steps = [
    ['1. Asset claim', s.step1],
    ['2. Child задлах', s.step2],
    ['3. Item claim', s.step3],
    ['4. Item шалгасан', s.step4],
    ['5. Item↔Asset холбосон', s.step5],
  ];
  steps.forEach(([label,done])=>{
    const chip = document.createElement('span');
    chip.style.cssText=`font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid ${done?'var(--accent2)':'var(--line)'};color:${done?'var(--accent2)':'var(--sub)'};background:${done?'#1a2e22':'transparent'};`;
    chip.textContent = (done?'✓ ':'') + label;
    wrap.appendChild(chip);
  });
  return wrap;
}

function mySummaryCard(deptName){
  const s = deptProgressStatus(deptName);
  // Count total assets and items belonging to this dept (including unclaimed items suggested for this dept)
  const totalMyAssets = state.fatherAssets.filter(a=>a.department===deptName).length;
  const totalMyItems = state.items.filter(it=>it.department===deptName).length;
  const unclaimedSuggested = state.items.filter(it=>!it.department && it.suggested_department===deptName).length;

  const c = card(`📊 ${deptName} — Ажлын явц`, '');

  // Big numbers row
  const nums = document.createElement('div');
  nums.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0;';
  [
    ['Father Asset', totalMyAssets, 'var(--accent)', 'father'],
    ['Child Asset', s.childDone, 'var(--accent2)', 'child'],
    [`Item (Spare parts)`, totalMyItems, '#f0a500', 'item'],
  ].forEach(([label,num,color,type])=>{
    const stat = document.createElement('div');
    stat.style.cssText=`background:var(--panel);padding:14px;border-radius:8px;border-left:4px solid ${color};cursor:pointer;transition:background .15s;`;
    stat.innerHTML=`<div style="font-size:11px;color:var(--sub);margin-bottom:4px">${label}</div><div style="font-size:28px;font-weight:700;color:${color}">${num}</div>`;
    stat.onmouseenter=()=>stat.style.background='var(--panel2)';
    stat.onmouseleave=()=>stat.style.background='var(--panel)';
    stat.onclick=()=>{
      // Toggle popup list below
      const existingPopup = document.getElementById('stat-popup-'+type);
      if(existingPopup){ existingPopup.remove(); return; }
      // Remove other popups
      document.querySelectorAll('[id^="stat-popup-"]').forEach(el3=>el3.remove());
      const popup = document.createElement('div');
      popup.id='stat-popup-'+type;
      popup.style.cssText='margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:300px;overflow-y:auto;';
      const tbl = document.createElement('table');
      tbl.style.fontSize='11px';
      if(type==='father'){
        const myFA = state.fatherAssets.filter(a=>a.department===deptName);
        tbl.innerHTML='<tr><th>Code</th><th>Description</th><th>Group</th><th>Category</th><th>Area</th></tr>'+
          myFA.map(a=>`<tr><td style="font-family:var(--mono)">${escapeHtml(a.code||'')}</td><td>${escapeHtml(a.name)}</td><td>${escapeHtml(a.asset_group||'')}</td><td>${escapeHtml(a.asset_category||'')}</td><td>${escapeHtml(a.process_area||'')}</td></tr>`).join('');
      } else if(type==='child'){
        const myCA = state.childAssets.filter(x=>x.department===deptName);
        tbl.innerHTML='<tr><th>Child Asset</th><th>Тоо</th><th>Father Asset</th></tr>'+
          myCA.map(c2=>{
            const fa=state.fatherAssets.find(x=>x.id===c2.father_id);
            return `<tr><td>${escapeHtml(c2.name)}</td><td>${escapeHtml(c2.qty||'1')}</td><td>${fa?escapeHtml(fa.name):''}</td></tr>`;
          }).join('');
      } else {
        const myIt = state.items.filter(it=>it.department===deptName);
        tbl.innerHTML='<tr><th>Code</th><th>Name</th><th>UOM</th><th>Status</th></tr>'+
          myIt.slice(0,100).map(it=>`<tr><td style="font-family:var(--mono);font-size:10px">${escapeHtml(it.code||'')}</td><td>${escapeHtml(it.name)}</td><td>${escapeHtml(it.uom||'')}</td><td>${escapeHtml(it.status||'')}</td></tr>`).join('');
        if(myIt.length>100) tbl.innerHTML+=`<tr><td colspan="4" style="color:var(--sub)">+ ${myIt.length-100} бусад...</td></tr>`;
      }
      popup.appendChild(tbl);
      c.appendChild(popup);
    };
    nums.appendChild(stat);
  });
  c.appendChild(nums);

  // Suggested but unclaimed hint
  if(unclaimedSuggested>0){
    const hint = document.createElement('div');
    hint.style.cssText='font-size:12px;color:var(--accent);margin-bottom:8px;';
    hint.textContent=`ℹ️ "Item шалгах" табд таны алба нэгжид санал болгосон ${unclaimedSuggested} item эзэмшигчгүй байна — "Манай албаных" дарж авна уу.`;
    c.appendChild(hint);
  }

  // Progress chips
  c.appendChild(myProgressBanner(deptName));
  return c;
}

// ---- Inline expand asset detail (render() дуудахгүй) ----
function toggleAssetDetail(fa, dept, app){
  if(!state.openAssets) state.openAssets = new Set();
  const detailId = 'asset-detail-' + fa.id;
  const existing = document.getElementById(detailId);
  if(existing){
    // Collapse
    existing.style.maxHeight = '0';
    existing.style.opacity = '0';
    setTimeout(()=>{ if(existing.parentNode) existing.remove(); }, 250);
    state.openAssets.delete(fa.id);
  } else {
    // Expand
    state.openAssets.add(fa.id);
    const block = renderFatherAssetBlock(fa, dept);
    block.id = detailId;
    block.style.cssText += 'transition:max-height .25s ease,opacity .25s ease;max-height:0;opacity:0;overflow:hidden;';
    app.appendChild(block);
    requestAnimationFrame(()=>{
      block.style.maxHeight = '1200px';
      block.style.opacity = '1';
    });
  }
}

      : '');
  descDiv.append(descLbl, descSel);

          <td class="link-note">${escapeHtml(row.process_area||'')}</td>
          <td style="text-align:center;color:var(--accent2);font-weight:700">0</td>
          <td style="text-align:center"><button class="btn ghost small" style="font-size:11px">▶ Child нэмэх</button></td>`;
        const btn = tr.querySelector('button');

          else state.openAssets.add(row.id);
          render();
        };
        tbl.appendChild(tr);
      }
    } else {
      render();
    }

  addCard.appendChild(addBtn);

  mineCard.querySelector('h2').id = 'mine-count';
  if(mine.length===0){ mineCard.appendChild(el('div','empty','Одоогоор эзэмшдэг asset алга')); app.appendChild(mineCard); return; }

  // Wrapper for fast DOM update
  const mineTableOuter = document.createElement('div');
  mineTableOuter.id = 'mine-table-wrap';

  // Search filter (if many)
  if(mine.length>5){
    const mf = document.createElement('input'); mf.type='text'; mf.placeholder='Хайх (код/нэр)...';

      <th>Asset Category</th>
      <th>Process Area</th>
      <th>Child</th>

      tr.style.cursor='pointer';

        <td style="font-family:var(--mono);font-size:11px">${escapeHtml(fa.code||'')}</td>
        <td style="font-weight:500">${escapeHtml(fa.name)}</td>

        <td style="text-align:center;color:var(--accent2);font-weight:700">${childCount}</td>

// ================= ITEM TAB =================
function renderItemTab(app){
  if(!ensureDept(app, 'Item (Spare parts) шалгаж баталгаажуулах.')) return;
  const dept = state.currentDept;

  if(session.role==='manager'){
    const b = card(`Таны алба нэгж: ${dept} — Item (Spare parts) шалгах`, 'Жагсаалтад буруу мэдээлэл байвал шууд засаж болно. Төлөвийг тохируулж "Идэвхтэй" болгоно.');
    b.appendChild(myProgressBanner(dept));
    app.appendChild(b);
  }
  app.appendChild(mySummaryCard(dept));

  // ---- Миний Item-ууд — шинэ table view ----
  const myItems = state.items.filter(it=>it.department===dept);
  const activeN = myItems.filter(it=>it.status==='active').length;
  const removeN = myItems.filter(it=>it.status==='remove_pending'||it.status==='removed').length;
  const reviewN = myItems.filter(it=>it.status==='needs_review').length;

  const miCard = card(`Миний Item-үүд (${myItems.length})`, `✓ Идэвхтэй: ${activeN} | ✕ Хасах: ${removeN} | ? Шалгаагүй: ${reviewN}`);

  if(myItems.length > 0){
    // Status filter chips
    const chipWrap = document.createElement('div'); chipWrap.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;';
    let activeFilter = 'all';
    const chips = [
      ['all','Бүгд', myItems.length],
      ['needs_review','Шалгаагүй', reviewN],
      ['active','Идэвхтэй', activeN],
      ['remove_pending','Хасах санал', myItems.filter(it=>it.status==='remove_pending').length],
      ['removed','Устгасан', myItems.filter(it=>it.status==='removed').length],
    ];
    const searchI = document.createElement('input'); searchI.type='text'; searchI.placeholder='Код/Нэр хайх...'; searchI.style.cssText='width:100%;margin-bottom:8px;';
    miCard.appendChild(searchI);
    chips.forEach(([val,label,cnt])=>{
      const ch = document.createElement('button'); ch.className='btn ghost small';
      ch.textContent=`${label} (${cnt})`; ch.style.fontWeight = val==='all'?'700':'normal';
      ch.onclick=()=>{ activeFilter=val; state.itemPage=0; drawItemTable(); chips.forEach((c2,i2)=>{chipWrap.children[i2].style.fontWeight=c2[0]===val?'700':'normal';}); };
      chipWrap.appendChild(ch);
    });
    miCard.appendChild(chipWrap);

    // Top pagination controls
    const topPaginationWrap = document.createElement('div');
    topPaginationWrap.id = 'top-pagination';
    topPaginationWrap.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:12px;';
    miCard.appendChild(topPaginationWrap);

    const tableWrap = document.createElement('div'); tableWrap.style.overflowX='auto';
    miCard.appendChild(tableWrap);

    function drawItemTable(){
      const f = norm(searchI.value);
      const filtered = myItems.filter(it=>{
        if(f && !norm(it.code).includes(f) && !norm(it.name).includes(f) && !norm(it.equipment||'').includes(f)) return false;
        if(activeFilter!=='all' && it.status!==activeFilter) return false;
        return true;
      });
      const statusLabel={active:'✓ Идэвхтэй',removed:'✕ Устгасан',remove_pending:'! Хасах санал',needs_review:'? Шалгаагүй'};
      const statusColor={active:'var(--accent2)',removed:'var(--danger)',remove_pending:'#f0a500',needs_review:'var(--sub)'};
      
      if(!state.itemPage) state.itemPage = 0;
      const PAGE_SIZE = 200;
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
      const page = Math.min(state.itemPage, totalPages - 1);
      const pageItems = filtered.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);

      // Top pagination controls
      if(filtered.length > PAGE_SIZE){
        const pgWrap = topPaginationWrap;
        pgWrap.innerHTML='';
        const prevBtn = document.createElement('button'); prevBtn.className='btn ghost small';
        prevBtn.textContent='◀ Өмнөх'; prevBtn.disabled = page===0;
        prevBtn.onclick=()=>{ state.itemPage = Math.max(0, page-1); drawItemTable(); };
        const info = document.createElement('span');
        info.style.color='var(--sub)';
        info.textContent=`${page*PAGE_SIZE+1}–${Math.min((page+1)*PAGE_SIZE, filtered.length)} / ${filtered.length}`;
        const nextBtn = document.createElement('button'); nextBtn.className='btn ghost small';
        nextBtn.textContent='Дараах ▶'; nextBtn.disabled = page >= totalPages-1;
        nextBtn.onclick=()=>{ state.itemPage = Math.min(totalPages-1, page+1); drawItemTable(); };
        pgWrap.append(prevBtn, info, nextBtn);
      } else {
        topPaginationWrap.innerHTML='';
      }

      const t = document.createElement('table');
      t.style.fontSize='12px';
      t.innerHTML=`<tr>
        <th>#</th><th>Код</th><th>Нэр</th><th>Үзүүлэлт</th><th>Тоноглол</th>
        <th>UOM</th><th>Min</th><th>Max</th><th>Чухал</th>
        <th>Segment</th><th>Family</th><th>Class</th><th>Commodity (UNSPSC)</th>
        <th>Төлөв</th><th></th>
      </tr>`;
      pageItems.forEach((it,idx)=>{
        const u = getUnspsc(it.code) || {};
        const tr = document.createElement('tr');
        const stColor = statusColor[it.status]||'var(--sub)';
        tr.innerHTML=`
          <td style="color:var(--sub)">${page*PAGE_SIZE+idx+1}</td>
          <td style="font-family:var(--mono);white-space:nowrap;font-size:11px">${escapeHtml(it.code)}</td>
          <td><input type="text" value="${escapeHtml(it.name||'')}" style="width:180px" data-id="${it.id}" data-field="name"></td>
          <td><input type="text" value="${escapeHtml(it.spec||'')}" style="width:120px" data-id="${it.id}" data-field="spec" placeholder="Үзүүлэлт"></td>
          <td><input type="text" value="${escapeHtml(it.equipment||'')}" style="width:120px" data-id="${it.id}" data-field="equipment" placeholder="Тоноглол"></td>
          <td><input type="text" value="${escapeHtml(it.uom||'')}" style="width:60px" data-id="${it.id}" data-field="uom"></td>
          <td><input type="text" value="${escapeHtml(it.min||'')}" style="width:50px" data-id="${it.id}" data-field="min"></td>
          <td><input type="text" value="${escapeHtml(it.max||'')}" style="width:50px" data-id="${it.id}" data-field="max"></td>
          <td><select data-id="${it.id}" data-field="criticality" style="width:60px">
            <option value="">--</option>
            ${['P1','P2','P3'].map(p=>`<option ${it.criticality===p?'selected':''}>${p}</option>`).join('')}
          </select></td>
          <td class="link-note" style="font-size:10px;max-width:120px">${escapeHtml(u.segment||'')}</td>
          <td class="link-note" style="font-size:10px;max-width:120px">${escapeHtml(u.family||'')}</td>
          <td class="link-note" style="font-size:10px;max-width:120px">${escapeHtml(u.cls||'')}</td>
          <td style="font-size:11px;color:var(--accent2);font-weight:600;max-width:150px">${escapeHtml(u.commodity||'')}</td>
          <td><select data-id="${it.id}" data-field="status" style="width:130px;color:${stColor}">
            <option value="needs_review" ${it.status==='needs_review'?'selected':''}>? Шалгаагүй</option>
            <option value="active" ${it.status==='active'?'selected':''}>✓ Идэвхтэй</option>
            <option value="remove_pending" ${it.status==='remove_pending'?'selected':''}>! Хасах санал</option>
            <option value="removed" ${it.status==='removed'?'selected':''}>✕ Устгасан</option>
          </select></td>
          <td style="color:var(--sub);font-size:10px">${it.note?'📝':''}</td>`;
        t.appendChild(tr);
      });
      tableWrap.appendChild(t);
      if(filtered.length>200) tableWrap.appendChild(el('div','link-note',`+ дахин ${filtered.length-200} мөр, хайлтаа нарийсга`));

      // Inline edit handlers
      t.querySelectorAll('input[data-id],select[data-id]').forEach(inp=>{
        inp.onchange = async ()=>{
          const id=inp.dataset.id; const field=inp.dataset.field; const val=inp.value;
          const it2=state.items.find(x=>x.id===id); if(!it2) return;
          if(field==='status' && val==='active'){
            if(!it2.uom){ toast('UOM заавал бөглөнө'); inp.value=it2.status; return; }
          }
          it2[field]=val;
          await dbUpdate('items', id, {[field]:val});
          toast('✅ Item өөрчлөгдлөө');
          if(field==='status') drawItemTable(); // refresh status colors
        };
      });
    }
    drawItemTable();
    searchI.oninput = ()=>{ state.itemPage=0; drawItemTable(); };
  } else {
    miCard.appendChild(el('div','empty','Танд хуваарилагдсан item алга байна. Item шалгах → "Эзэмшигчгүй Item"-с claim хийнэ үү.'));
  }
  app.appendChild(miCard);

  // ---- Эзэмшигчгүй item (claim хийх) ----
  const unclaimedItems = state.items.filter(it=>!it.department);
  if(unclaimedItems.length>0){
    const uiCard = card(`Эзэмшигчгүй Item (${unclaimedItems.length})`, 'Алба нэгж тодорхойгүй item-үүд. Өөрт хамаарахыг хайж "Манай албаных" дарж ав.');
    const searchU = document.createElement('input'); searchU.type='text'; searchU.placeholder='Хайх (код/нэр/тоноглол)...'; searchU.style.cssText='width:100%;margin-bottom:10px;';
    uiCard.appendChild(searchU);
    const listWrap = document.createElement('div'); uiCard.appendChild(listWrap);
    function drawUnclaimed(){
      const f=norm(searchU.value);
      const filtered=unclaimedItems.filter(it=>!f||norm(it.code).includes(f)||norm(it.name).includes(f)||norm(it.equipment||'').includes(f)||norm(it.suggested_department||'').includes(f));
      
      if(!state.unclaimedPage) state.unclaimedPage = 0;
      const PAGE_SIZE = 200;
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
      const page = Math.min(state.unclaimedPage, totalPages - 1);
      const pageItems = filtered.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
      
      listWrap.innerHTML='';
      
      // Pagination
      if(filtered.length > PAGE_SIZE){
        const pgWrap = document.createElement('div');
        pgWrap.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:12px;';
        const prevBtn = document.createElement('button'); prevBtn.className='btn ghost small';
        prevBtn.textContent='◀ Өмнөх'; prevBtn.disabled = page===0;
        prevBtn.onclick=()=>{ state.unclaimedPage = Math.max(0, page-1); drawUnclaimed(); };
        const info = document.createElement('span');
        info.style.color='var(--sub)';
        info.textContent=`${page*PAGE_SIZE+1}–${Math.min((page+1)*PAGE_SIZE, filtered.length)} / ${filtered.length}`;
        const nextBtn = document.createElement('button'); nextBtn.className='btn ghost small';
        nextBtn.textContent='Дараах ▶'; nextBtn.disabled = page >= totalPages-1;
        nextBtn.onclick=()=>{ state.unclaimedPage = Math.min(totalPages-1, page+1); drawUnclaimed(); };
        pgWrap.append(prevBtn, info, nextBtn);
        listWrap.appendChild(pgWrap);
      }
      
      const t=document.createElement('table');
      t.style.fontSize='12px';
      t.innerHTML='<tr><th>Код</th><th>Нэр</th><th>Тоноглол</th><th>UOM</th><th>Min/Max</th><th>Segment → Commodity</th><th>Санал болгосон</th><th>Төлөв</th><th></th></tr>'+
        pageItems.map(it=>{
          const u = getUnspsc(it.code) || {};
          const catStr = u.commodity ? `${escapeHtml(u.segment||'')} › ${escapeHtml(u.cls||'')} › <strong>${escapeHtml(u.commodity)}</strong>` : '';
          const removeTag=it.status==='remove_pending'?'<span class="tag dup" style="font-size:10px">Хасах санал</span>':'';
          return `<tr>
            <td style="font-family:var(--mono);font-size:11px;white-space:nowrap">${escapeHtml(it.code)}</td>
            <td>${escapeHtml(it.name)}</td>
            <td class="link-note">${escapeHtml(it.equipment||'')}</td>
            <td>${escapeHtml(it.uom||'')}</td>
            <td>${escapeHtml(it.min||'')}/${escapeHtml(it.max||'')}</td>
            <td style="font-size:11px;max-width:200px">${catStr}</td>
            <td class="link-note">${escapeHtml(it.suggested_department||'')}</td>
            <td>${removeTag}</td>
            <td><button class="btn small" data-id="${it.id}">Манай албаных</button></td>
          </tr>`;
        }).join('');
      listWrap.appendChild(t);
      t.querySelectorAll('button[data-id]').forEach(b=>{
        b.onclick=async()=>{
          const it2=state.items.find(x=>x.id===b.dataset.id);
          await dbUpdate('items',it2.id,{department:dept}); 
          it2.department=dept; 
          toast('✅ Item авлаа');
          render();
        };
      });
      if(filtered.length>200) listWrap.appendChild(el('div','link-note',`+ дахин ${filtered.length-200} мөр`));
    }
    drawUnclaimed(); searchU.oninput=drawUnclaimed;
    app.appendChild(uiCard);
  }
}

function renderItemReviewRow(it){
  const wrap = document.createElement('div');
  wrap.style.cssText='background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;';
  const head = document.createElement('div'); head.className='flex-between';
  head.innerHTML = `<div style="font-family:var(--mono);font-size:12px">${escapeHtml(it.code)} <span style="font-family:inherit">— ${escapeHtml(it.name)}</span></div>`;
  wrap.appendChild(head);
  if(it.note){ wrap.appendChild(el('div','link-note', 'Эх тайлбар: ' + it.note)); }

  const fi = document.createElement('div'); fi.className='field-inline';
  ['category','min','max','uom'].forEach(f=>{
    const lbl = document.createElement('label'); lbl.textContent = f.toUpperCase()+':';
    const inp = document.createElement('input'); inp.type='text'; inp.value = it[f]||'';
    inp.onchange = async ()=>{ it[f]=inp.value; await dbUpdate('items', it.id, {[f]: inp.value}); };
    fi.append(lbl, inp);
  });
  wrap.appendChild(fi);

  const statusRow = document.createElement('div'); statusRow.style.marginTop='8px'; statusRow.className='row';
  const statusLbl = document.createElement('span'); statusLbl.className='link-note'; statusLbl.textContent='Төлөв:';
  const statusSel = document.createElement('select');
  statusSel.innerHTML = `
    <option value="needs_review" ${it.status==='needs_review'?'selected':''}>Шалгагдаагүй</option>
    <option value="active" ${it.status==='active'?'selected':''}>Идэвхтэй (баталгаажсан)</option>
    <option value="remove_pending" ${it.status==='remove_pending'?'selected':''}>Хасах санал</option>
    <option value="removed" ${it.status==='removed'?'selected':''}>Устгах (баталгаажсан)</option>`;
  statusSel.onchange = async ()=>{
    const newStatus = statusSel.value;
    if(newStatus==='active'){
      const missing = ['category','min','max','uom'].filter(f=>!(it[f]&&it[f].toString().trim()));
      if(missing.length){
        toast('Идэвхтэй болгохын өмнө дараах талбарыг бөглөнө үү: ' + missing.join(', '));
        statusSel.value = it.status;
        return;
      }
    }
    it.status = newStatus;
    await dbUpdate('items', it.id, {status: newStatus});
    render();
  };
  statusRow.append(statusLbl, statusSel);
  wrap.appendChild(statusRow);

  // Oracle FBDI item fields (collapsible)
  const oracleToggle = document.createElement('button');
  oracleToggle.className='btn ghost small'; oracleToggle.style.marginTop='6px';
  oracleToggle.textContent='⚙ Oracle талбар (Org, Status, UOM...)';
  const oracleWrap = document.createElement('div');
  oracleWrap.style.cssText='display:none;margin-top:8px;padding:10px;background:var(--panel);border-radius:6px;';
  oracleToggle.onclick = ()=>{ oracleWrap.style.display = oracleWrap.style.display==='none'?'block':'none'; };
  const fields = [
    ['transaction_type','Transaction Type','select:Create,Sync'],
    ['org_code','Organization Code','text'],
    ['item_status','Item Status','select:Active,Inactive'],
    ['item_type','Item Type','text'],
    ['primary_uom','Primary UOM Code','text'],
    ['item_class','Item Class / Template','text'],
    ['source_system','Source System Code','text'],
  ];
  const grid = document.createElement('div'); grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;';
  fields.forEach(([key,label,type])=>{
    const fw = document.createElement('div');
    const lb = document.createElement('label'); lb.textContent=label; lb.style.cssText='font-size:11px;color:var(--sub);display:block;margin-bottom:2px;';
    let inp;
    if(type.startsWith('select:')){
      inp = document.createElement('select');
      const opts = type.split(':')[1].split(',');
      inp.innerHTML = '<option value="">--</option>' + opts.map(o=>`<option ${it[key]===o?'selected':''}>${o}</option>`).join('');
    } else {
      inp = document.createElement('input'); inp.type='text'; inp.value=it[key]||'';
    }
    inp.style.width='100%';
    inp.onchange = async ()=>{ it[key]=inp.value; await dbUpdate('items', it.id, {[key]: inp.value}); };
    fw.append(lb, inp);
    grid.appendChild(fw);
  });
  oracleWrap.appendChild(grid);
  wrap.appendChild(oracleToggle);
  wrap.appendChild(oracleWrap);
  return wrap;
}

    </div>`;

  const btnGroup = document.createElement('div'); btnGroup.style.cssText='display:flex;gap:6px;flex-shrink:0;margin-left:10px;';
  const unclaimBtn = document.createElement('button'); unclaimBtn.className='btn ghost small'; unclaimBtn.textContent='Буцаах';
  unclaimBtn.onclick = async (e)=>{ e.stopPropagation(); await dbUpdate('father_assets', fa.id, {department:null}); fa.department=null; render(); };
  btnGroup.appendChild(unclaimBtn);

  head.append(info, btnGroup);
  head.onclick = ()=>{
    if(!state.openAssets) state.openAssets = new Set();
    if(state.openAssets.has(fa.id)) state.openAssets.delete(fa.id);
    else state.openAssets.add(fa.id);
    render();
  };
  block.appendChild(head);

  if(!isOpen) return block; // collapsed — header only

  // ---- Expanded: full detail + child assets ----
  const detail = document.createElement('div');
  detail.style.cssText='margin-top:10px;padding:10px;background:var(--panel2);border-radius:6px;';

  // Full info table
  const infoTable = document.createElement('table');
  infoTable.style.cssText='font-size:12px;margin-bottom:10px;width:100%';
  infoTable.innerHTML = [
    ['Asset Number', fa.code],
    ['Asset Description', fa.name],
    ['Asset Group', fa.asset_group],
    ['Group Description', fa.asset_group_desc],
    ['Asset Category', fa.asset_category],
    ['Process Area', fa.process_area],
  ].filter(([,v])=>v).map(([k,v])=>`<tr><td style="color:var(--sub);width:160px;padding:3px 0">${k}</td><td style="color:var(--text);font-weight:500">${escapeHtml(v||'')}</td></tr>`).join('');
  detail.appendChild(infoTable);

  // ---- Child assets ----
  const children = state.childAssets.filter(c=>c.father_id===fa.id);
  const childTitle = document.createElement('div');
  childTitle.style.cssText='font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding-top:8px;border-top:1px solid var(--line);';
  childTitle.textContent=`Child Asset-ууд (${children.length}) — BOM-д холбогдох бодит тоног төхөөрөмж`;
  detail.appendChild(childTitle);

  if(children.length===0){
    detail.appendChild(el('div','link-note','Одоогоор child asset алга — доор нэмнэ үү'));
  }
  children.forEach(c=>detail.appendChild(renderChildAsset(c)));

  // ---- Child нэмэх ----
  const addTitle = document.createElement('div');
  addTitle.style.cssText='font-size:12px;color:var(--accent);font-weight:600;margin-top:12px;margin-bottom:6px;';
  addTitle.textContent='➕ Шинэ Child Asset нэмэх';
  const addNote = document.createElement('div');
  addNote.style.cssText='font-size:11px;color:var(--sub);margin-bottom:8px;';
  addNote.textContent='Жишээ: "Boiler #1 Feed Pump", "SA Fan #1" — нэг хүснэгтийн нэг мөр = нэг бодит машин/хэсэг';
  detail.appendChild(addTitle);
  detail.appendChild(addNote);

  const row1 = document.createElement('div'); row1.style.cssText='display:flex;gap:8px;align-items:center;';
  const cName = document.createElement('input'); cName.type='text';
  cName.placeholder='Child asset нэр (жишээ: SA Fan #1)';
  cName.style.cssText='flex:1;font-size:13px;';
  const cQty = document.createElement('input'); cQty.type='number';
  cQty.placeholder='Тоо'; cQty.style.width='70px'; cQty.value='1';
  const cBtn = document.createElement('button'); cBtn.className='btn';
  cBtn.textContent='+ Child нэмэх'; cBtn.style.whiteSpace='nowrap';

  cBtn.onclick = async ()=>{
    const nm = cName.value.trim();
    if(!nm){ toast('Child asset-н нэрийг бичнэ үү'); cName.focus(); return; }
    cBtn.disabled=true; cBtn.textContent='⏳ Хадгалж байна...';
    const row = { id:uid(), father_id:fa.id, name:nm, qty:cQty.value||'1', department:dept };
    const {error} = await sb.from('child_assets').insert(row);
    if(error){ toast('❌ Алдаа: '+error.message); cBtn.disabled=false; cBtn.textContent='+ Child нэмэх'; return; }
    state.childAssets.push(row);
    toast('✅ Child asset нэмэгдлээ');
    cName.value=''; cQty.value='1';
    cBtn.disabled=false; cBtn.textContent='+ Child нэмэх';

    // DOM-д шууд нэм — render() биш
    const newChildEl = renderChildAsset(row);
    newChildEl.style.cssText += 'animation:fadeIn .2s ease';
    addTitle.parentNode.insertBefore(newChildEl, addTitle);

    // Child тоог table дотор шинэчил
    const detailId = 'asset-detail-' + fa.id;
    const detailEl = document.getElementById(detailId);
    if(detailEl){
      const countEl = detailEl.querySelector('.child-count-badge');
      if(countEl) countEl.textContent = state.childAssets.filter(c=>c.father_id===fa.id).length;
    }
    // Mine table child тоог шинэчил
    const mineTbl = document.getElementById('mine-table-wrap');
    if(mineTbl){
      const btns = mineTbl.querySelectorAll('button');
      // find the row with this fa
      const allTds = mineTbl.querySelectorAll('td');
      allTds.forEach(td=>{
        if(td.textContent===fa.name){
          const countTd = td.closest('tr').querySelector('td:nth-child(6)');
          if(countTd) countTd.textContent = state.childAssets.filter(c=>c.father_id===fa.id).length;
        }
      });
    }
  };
  cName.onkeydown = e=>{ if(e.key==='Enter') cBtn.click(); };
  row1.append(cName, cQty, cBtn);
  detail.appendChild(row1);

  block.appendChild(detail);
  return block;
}

function renderChildAsset(c){
  const wrap = document.createElement('div');
  wrap.style.cssText='background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;';
  const head = document.createElement('div'); head.className='flex-between';
  head.innerHTML = `<div>▸ <strong>${escapeHtml(c.name)}</strong> ${c.qty?`<span class="link-note">x${escapeHtml(c.qty)}</span>`:''}</div>`;
  const rm = document.createElement('button'); rm.className='btn ghost small'; rm.textContent='Устгах';
  rm.onclick = async ()=>{
    await dbDelete('child_assets', c.id); // cascades links via FK
    state.childAssets = state.childAssets.filter(x=>x.id!==c.id);
    state.links = state.links.filter(l=>l.child_asset_id!==c.id);
    render();
  };
  head.appendChild(rm);
  wrap.appendChild(head);

  // Oracle FBDI fields (collapsible)
  const oracleToggle = document.createElement('button');
  oracleToggle.className='btn ghost small'; oracleToggle.style.marginTop='6px';
  oracleToggle.textContent='⚙ Oracle талбар (өртөг, элэгдэл, огноо...)';
  const oracleWrap = document.createElement('div');
  oracleWrap.style.cssText='display:none;margin-top:8px;padding:10px;background:var(--panel2);border-radius:6px;';
  oracleToggle.onclick = ()=>{ oracleWrap.style.display = oracleWrap.style.display==='none'?'block':'none'; };
  const oracleFields = [
    ['category','Asset Category (Oracle)','text'],
    ['date_in_service','Ашиглалтад орсон огноо (DD/MM/YYYY)','text'],
    ['asset_cost','Өртөг (Asset Cost)','text'],
    ['asset_type','Asset Type','select:Capitalized,CIP,Expensed'],
    ['deprn_method','Элэгдлийн арга','select:STL,Flat-Rate,Units of Production'],
    ['life_months','Ашиглалтын хугацаа (сар)','text'],
    ['location','Байршил (Location)','text'],
    ['criticality','Чухал түвшин','select:Өндөр,Дунд,Бага'],
    ['manufacturer','Manufacturer','text'],
    ['model','Model','text'],
    ['serial','Serial Number','text'],
  ];
  const grid = document.createElement('div'); grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;';
  oracleFields.forEach(([key,label,type])=>{
    const fw = document.createElement('div');
    const lb = document.createElement('label'); lb.textContent=label; lb.style.cssText='font-size:11px;color:var(--sub);display:block;margin-bottom:2px;';
    let inp;
    if(type.startsWith('select:')){
      inp = document.createElement('select');
      const opts = type.split(':')[1].split(',');
      inp.innerHTML = '<option value="">--</option>' + opts.map(o=>`<option ${c[key]===o?'selected':''}>${o}</option>`).join('');
    } else {
      inp = document.createElement('input'); inp.type='text'; inp.value=c[key]||'';
    }
    inp.style.width='100%';
    inp.onchange = async ()=>{ c[key]=inp.value; await dbUpdate('child_assets', c.id, {[key]: inp.value}); };
    fw.append(lb, inp);
    grid.appendChild(fw);
  });
  oracleWrap.appendChild(grid);
  wrap.appendChild(oracleToggle);
  wrap.appendChild(oracleWrap);
  links.forEach(l=>wrap.appendChild(renderItemLink(l)));

  const searchWrap = document.createElement('div'); searchWrap.className='search-box'; searchWrap.style.marginTop='6px';
  const sIn = document.createElement('input'); sIn.type='text'; sIn.placeholder='Item хайж холбох (код/нэр)...'; sIn.style.width='100%';
  const results = document.createElement('div'); results.className='search-results'; results.style.display='none';
  sIn.oninput = ()=>{
    const f = norm(sIn.value);
    if(!f){ results.style.display='none'; return; }
    const matches = state.items.filter(it=>it.status!=='removed' && (norm(it.code).includes(f)||norm(it.name).includes(f))).slice(0,20);
    results.innerHTML='';
    if(matches.length===0){ results.innerHTML='<div>Олдсонгүй</div>'; }
    matches.forEach(it=>{
      const d = document.createElement('div');
      d.textContent = `${it.code} — ${it.name}`;
      d.onclick = async ()=>{
        const row = { id: uid(), child_asset_id: c.id, item_id: it.id, qty:'', verified:false, corr_category:'', corr_min:'', corr_max:'', corr_uom:'' };
        await dbInsert('links', row);
        state.links.push(row);
        sIn.value=''; results.style.display='none'; render();
      };
      results.appendChild(d);
    });
    results.style.display='block';
  };
  searchWrap.append(sIn, results);
  wrap.appendChild(searchWrap);
  return wrap;
}

function renderItemLink(l){
  const it = state.items.find(x=>x.id===l.item_id);
  const wrap = document.createElement('div');
  wrap.style.cssText='background:var(--panel2);border-radius:6px;padding:8px 10px;margin:6px 0;';
  if(!it){ wrap.innerHTML = '<span class="link-note">Item олдсонгүй</span>'; return wrap; }
  const head = document.createElement('div'); head.className='flex-between';
  head.innerHTML = `<div style="font-family:var(--mono);font-size:12px">${escapeHtml(it.code)} <span style="font-family:inherit">— ${escapeHtml(it.name)}</span></div>`;
  const rmBtn = document.createElement('button'); rmBtn.className='btn ghost small'; rmBtn.textContent='×';
  rmBtn.onclick = async ()=>{ await dbDelete('links', l.id); state.links = state.links.filter(x=>x.id!==l.id); render(); };
  head.appendChild(rmBtn);
  wrap.appendChild(head);

  const fi = document.createElement('div'); fi.className='field-inline';
  const qtyLbl = document.createElement('label'); qtyLbl.textContent='Тоо ш:';
  const qtyIn = document.createElement('input'); qtyIn.type='number'; qtyIn.value=l.qty||'';
  qtyIn.onchange = async ()=>{ l.qty = qtyIn.value; await dbUpdate('links', l.id, {qty:l.qty}); };
  fi.append(qtyLbl, qtyIn);

  const fieldMap = { category:'corr_category', min:'corr_min', max:'corr_max', uom:'corr_uom' };
  Object.entries(fieldMap).forEach(([label, dbField])=>{
    const lbl = document.createElement('label'); lbl.textContent = label.toUpperCase()+':';
    const inp = document.createElement('input'); inp.type='text';
    inp.value = l[dbField] || it[label] || '';
    inp.onchange = async ()=>{ l[dbField] = inp.value; await dbUpdate('links', l.id, {[dbField]: inp.value}); };
    fi.append(lbl, inp);
  });
  wrap.appendChild(fi);

  const verifyRow = document.createElement('div'); verifyRow.style.marginTop='6px';
  const chk = document.createElement('label'); chk.style.fontSize='12px'; chk.style.cursor='pointer';
  const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=!!l.verified; cb.style.marginRight='6px';
  cb.onchange = async ()=>{ l.verified = cb.checked; await dbUpdate('links', l.id, {verified: l.verified}); render(); };
  chk.append(cb, document.createTextNode('Менежерээр баталгаажсан'));
  verifyRow.appendChild(chk);
  wrap.appendChild(verifyRow);
  return wrap;
}

// ================= MATRIX TAB =================
let matrixSelectedChildIds = [];
let matrixSelectedItemIds = [];

function renderMatrix(app){
  if(session.role==='manager') state.currentDept = session.deptName;
  if(session.role==='admin'){
    const sel = card('Алба нэгж сонго', '');
    const row = document.createElement('div'); row.className='row';

    s.innerHTML = '<option value="">-- сонгох --</option>' + state.departments.map(d=>`<option ${state.currentDept===d.name?'selected':''} value="${escapeHtml(d.name)}">${escapeHtml(d.name)}</option>`).join('');
    s.onchange = ()=>{ state.currentDept = s.value||null; render(); };

  }
  if(!state.currentDept){ app.appendChild(el('div','empty','Ажиллах алба нэгжээ сонгоно уу')); return; }

  const dept = state.currentDept;
  const myItems = state.items.filter(it=>it.department===dept && it.status!=='removed');

  const listCard = card(`📋 Item → Asset холбох (${dept})`, `Item бүрийн "🔗 Холбох" дарж Father/Child asset-д хэдэн ш ордгийг бичнэ. ${myItems.length} item, ${myFathers.length} father, ${myChildren.length} child asset.`);

  if(myItems.length===0){
    listCard.appendChild(el('div','empty','"Item шалгах" табд item claim хийсний дараа энд харагдана.'));
    app.appendChild(listCard); return;
  }
  if(myFathers.length===0){
    listCard.appendChild(el('div','empty','"Asset шалгах" табд asset claim хийсний дараа энд ажиллана.'));
    app.appendChild(listCard); return;
  }

  const searchInp = document.createElement('input'); searchInp.type='text';
  searchInp.placeholder='Item хайх (код/нэр/тоноглол)...';
  searchInp.style.cssText='width:100%;margin-bottom:10px;font-size:13px;';
  listCard.appendChild(searchInp);

  const listWrap = document.createElement('div');
  listCard.appendChild(listWrap);

  function linkSummaryHtml(itemId){
    const links = state.links.filter(l=>l.item_id===itemId);
    if(!links.length) return '<span style="color:var(--sub)">—</span>';
    return links.map(l=>{
      if(l.father_asset_id){
        const fa = state.fatherAssets.find(a=>a.id===l.father_asset_id);
        return fa ? '<span style="color:var(--accent)">'+escapeHtml(fa.name)+' ('+l.qty+'ш)</span>' : '';
      }
      if(l.child_asset_id){
        const ca = state.childAssets.find(c=>c.id===l.child_asset_id);
        return ca ? '<span style="color:var(--accent2)">'+escapeHtml(ca.name)+' ('+l.qty+'ш)</span>' : '';
      }
      return '';
    }).filter(Boolean).join(', ');
  }

  function drawBomList(){
    const f=norm(searchInp.value);
    const filtered = myItems.filter(it=>!f||norm(it.code||'').includes(f)||norm(it.name).includes(f)||norm(it.equipment||'').includes(f));

    const tbl = document.createElement('table');
    tbl.style.fontSize='12px';
    tbl.innerHTML='<tr><th style="width:30px">#</th><th>Код</th><th>Нэр</th><th>Тоноглол</th><th>Холбогдсон Asset</th><th style="width:80px"></th></tr>';

    filtered.slice(0,200).forEach((it,idx)=>{
      const tr = document.createElement('tr');
      tr.innerHTML='<td style="color:var(--sub)">'+(idx+1)+'</td>'+
        '<td style="font-family:var(--mono);font-size:10px;white-space:nowrap">'+escapeHtml(it.code||'')+'</td>'+
        '<td style="font-weight:500;max-width:220px">'+escapeHtml(it.name)+'</td>'+
        '<td class="link-note" style="max-width:120px">'+escapeHtml(it.equipment||'')+'</td>'+
        '<td style="font-size:11px" class="link-summary">'+linkSummaryHtml(it.id)+'</td>'+
        '<td><button class="btn ghost small" style="font-size:11px">\u{1F517} Холбох</button></td>';

      tr.querySelector('button').onclick = ()=>{

                let lk=state.links.find(l=>l.child_asset_id===c2.id&&l.item_id===it.id);
                if(!val||val==='0'){
                  if(lk){await dbDelete('links',lk.id);state.links=state.links.filter(x=>x.id!==lk.id);}
                  qi.style.background='';toast('\u2705 Хасагдлаа');
                } else if(lk){
                  lk.qty=val;await dbUpdate('links',lk.id,{qty:val});
                  qi.style.background='#1a2e22';toast('\u2705 Шинэчлэгдлээ');
                } else {
                  const nr={id:uid(),child_asset_id:c2.id,father_asset_id:null,item_id:it.id,qty:val,verified:false};
                  await dbInsert('links',nr);state.links.push(nr);
                  qi.style.background='#1a2e22';toast('\u2705 Холболт нэмэгдлээ');
                }
                const st=tr.querySelector('.link-summary');
                if(st) st.innerHTML=linkSummaryHtml(it.id);
              }
              qi.onchange=saveCa;sb2.onclick=saveCa;
              r2.append(nm,ql,qi,sb2);editTd.appendChild(r2);
            });
          });
        }
        editRow.appendChild(editTd);
        tr.parentNode.insertBefore(editRow, tr.nextSibling);
      };
      tbl.appendChild(tr);
    });
    if(filtered.length>200) listWrap.appendChild(el('div','link-note','+ '+(filtered.length-200)+' бусад...'));
    listWrap.appendChild(tbl);
  }
  searchInp.oninput = drawBomList;
  drawBomList();
  app.appendChild(listCard);
}

function downloadCsv(rows, filename){
  const csv = rows.map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

function card(title, desc){
  const c = document.createElement('div'); c.className='card';
  const h = document.createElement('h2'); h.textContent = title; c.appendChild(h);
  if(desc){ const d = document.createElement('div'); d.className='desc'; d.textContent = desc; c.appendChild(d); }
  return c;
}
function el(tag, cls, text){ const e = document.createElement(tag); e.className=cls; e.textContent=text; return e; }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

loadAll();
