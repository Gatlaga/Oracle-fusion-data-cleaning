// UNSPSC category lookup from item code (first 8 digits)
function getUnspsc(itemCode){
  if(!itemCode || typeof UNSPSC === 'undefined') return null;
  const code = itemCode.toString().trim().replace(/\D/g,'');
  if(code.length < 8) return null;
  const com8 = code.slice(0,8);
  const cls6 = com8.slice(0,6);
  const fam4 = com8.slice(0,4);
  const seg2 = com8.slice(0,2);
  return {
    segment: UNSPSC.s[seg2] || '',
    family:  UNSPSC.f[fam4] || '',
    cls:     UNSPSC.c[cls6] || '',
    commodity: UNSPSC.com[com8] || '',
    codes: { seg2, fam4, cls6, com8 }
  };
}

function unspscBadge(itemCode){
  const u = getUnspsc(itemCode);
  if(!u || !u.commodity) return '';
  return `<div style="margin-top:4px;font-size:11px;background:var(--panel);padding:4px 8px;border-radius:4px;border-left:3px solid var(--accent2)">
    <span style="color:var(--sub)">UNSPSC: </span>
    <span style="color:var(--sub)">${escapeHtml(u.segment)}</span>
    <span style="color:var(--sub)"> › </span>
    <span style="color:var(--sub)">${escapeHtml(u.family)}</span>
    <span style="color:var(--sub)"> › </span>
    <span style="color:var(--sub)">${escapeHtml(u.cls)}</span>
    <span style="color:var(--sub)"> › </span>
    <span style="color:var(--accent2);font-weight:600">${escapeHtml(u.commodity)}</span>
  </div>`;
}

// ---------- SUPABASE DATA LAYER ----------
async function loadAll(){
  if(!sb){ renderSetupScreen(); return; }
  try{
    const [d,f,c,i,l] = await Promise.all([
      sb.from('departments').select('*'),
      sb.from('father_assets').select('*'),
      sb.from('child_assets').select('*'),
      sb.from('items').select('*'),
      sb.from('links').select('*'),
    ]);
    for(const r of [d,f,c,i,l]){ if(r.error) throw r.error; }
    state.departments = (d.data || []).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    state.fatherAssets = f.data || [];
    state.childAssets = c.data || [];
    state.items = i.data || [];
    state.links = l.data || [];
    connOk = true;
  }catch(e){
    console.error(e);
    connOk = false;
    toast('Supabase холболтын алдаа: ' + e.message);
  }
  updateConnBadge();
  render();
}
function updateConnBadge(){
  const b = document.getElementById('connBadge');
  if(!sb){ b.textContent = 'Тохируулаагүй'; b.className = 'conn-badge conn-bad'; return; }
  b.textContent = connOk ? 'Холбогдсон' : 'Холболтын алдаа';
  b.className = 'conn-badge ' + (connOk ? 'conn-ok' : 'conn-bad');
}

async function dbInsert(table, row){
  const { error } = await sb.from(table).insert(row);
  if(error){ toast('Алдаа: '+error.message); throw error; }
}
async function dbUpdate(table, id, patch){
  const { error } = await sb.from(table).update(patch).eq('id', id);
  if(error){ toast('Алдаа: '+error.message); throw error; }
}
async function dbDelete(table, id){
  const { error } = await sb.from(table).delete().eq('id', id);
  if(error){ toast('Алдаа: '+error.message); throw error; }
}
async function dbDeleteMatch(table, col, val){
  const { error } = await sb.from(table).delete().eq(col, val);
  if(error){ toast('Алдаа: '+error.message); throw error; }
}

// ---------- NAV ----------
function renderNav(){
  const nav = document.getElementById('navBar');
  nav.innerHTML = '';
  let tabs;
  if(session.role==='admin'){
    tabs = [['admin','Ерөнхий/Тохиргоо'],['asset','Asset шалгах'],['item','Item шалгах'],['matrix','Item↔Asset холбох'],['export','Экспорт'],['guide','Заавар']];
  } else {
    tabs = [['asset','Asset шалгах'],['item','Item (Spare parts) шалгах'],['matrix','Item↔Asset холбох'],['export','Экспорт'],['guide','Заавар']];
  }
  tabs.forEach(([key,label])=>{
    const b = document.createElement('button');
    b.textContent = label;
    b.className = state.currentTab===key ? 'active':'';
    b.onclick = ()=>{ state.currentTab=key; render(); };
    nav.appendChild(b);

  const lo = document.createElement('button');
  lo.className = 'logout-btn';
  lo.innerHTML = `<span style="opacity:.7">${session.role==='admin'?'Админ':session.deptName}</span> · Гарах`;
  lo.style.marginLeft = '8px';
  lo.onclick = ()=>{ if(confirm('Гарах уу?')){ session={role:null,deptName:null}; state.currentDept=null; render(); } };
  nav.appendChild(lo);
}

// ---------- RENDER ROOT ----------
function render(){
  if(!sb){ renderSetupScreen(); return; }
  if(!session.role){ renderLogin(); return; }
  renderNav();
  updateConnBadge();
  const app = document.getElementById('app');
  app.innerHTML = '';
  // managers can't access admin tabs
  if(session.role==='manager' && state.currentTab==='admin'){
    state.currentTab = 'asset';
  }
  // migrate old 'work' tab to new 'asset'
  if(state.currentTab==='work') state.currentTab = 'asset';
  if(state.currentTab==='admin') renderAdmin(app);
  else if(state.currentTab==='asset') renderAssetTab(app);
  else if(state.currentTab==='item') renderItemTab(app);
  else if(state.currentTab==='matrix') renderMatrix(app);
  else if(state.currentTab==='guide') renderGuide(app);
  else renderExport(app);
}

// ================= ADMIN TAB =================
function deptProgressStatus(deptName){
  const f = state.fatherAssets.filter(a=>a.department===deptName);
  const cList = state.childAssets.filter(x=>x.department===deptName);
  const cIds = cList.map(x=>x.id);
  const myItems = state.items.filter(it=>it.department===deptName);
  const activeItems = myItems.filter(it=>it.status==='active' || it.status==='removed');
  const links = state.links.filter(x=>cIds.includes(x.child_asset_id));
  return {
    assetClaimed: f.length,
    childDone: cList.length,
    itemClaimed: myItems.length,
    itemReviewed: activeItems.length,
    linksMade: links.length,
    // step completion booleans
    step1: f.length>0,                                   // Asset claim
    step2: cList.length>0,                                // Child задлах
    step3: myItems.length>0,                              // Item claim
    step4: myItems.length>0 && activeItems.length===myItems.length,  // бүх item шалгасан
    step5: links.length>0,                               // Item-Asset холбосон
  };
}

function progressRow(label, num, den){
  const wrap = document.createElement('div'); wrap.style.marginBottom='12px';

    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>`;

async function handleCsvImport(e, kind){
  const file = e.target.files[0];
  if(!file) return;
  Papa.parse(file, { header:true, skipEmptyLines:true, complete: async (res)=>{
    const cols = res.meta.fields || [];
    openColumnMapModal(kind, cols, res.data);
  }});
}

function openColumnMapModal(kind, cols, rows){
  const root = document.getElementById('modalRoot');
  const fields = kind==='father'
    ? [
        ['code','Код (Asset Number)'],
        ['name','Нэр (Asset Description)'],
        ['assetGroup','Asset Group'],
        ['assetGroupDesc','Asset Group Description'],
        ['assetCategory','Asset Category'],
        ['processArea','Process Area'],
        ['department','Санал болгож буй алба нэгж → автоматаар хуваарилна'],
      ]
    : [
        ['code','Код (Item Code)'],
        ['name','Анхны нэр'],
        ['revisedName','Зассан нэр (заавал биш)'],
        ['spec','Үзүүлэлт / Spec (заавал биш)'],
        ['equipment','Тоноглол / Equipment (заавал биш)'],
        ['uom','UOM'],
        ['min','Min Qty'],
        ['max','Max Qty'],
        ['criticality','Чухал түвшин (заавал биш)'],
        ['department','Санал болгож буй алба нэгж → автоматаар хуваарилна'],
        ['note','Тайлбар (заавал биш)'],
      ];
  const bg = document.createElement('div'); bg.className='modal-bg';
  const modal = document.createElement('div'); modal.className='modal';
  modal.style.maxHeight='80vh'; modal.style.overflowY='auto';
  modal.innerHTML = `<h3>${kind==='father'?'Father Asset':'Item'} багана харгалзуулах</h3>
    <div class="desc">CSV-ийн ямар багана юу болохыг сонгоно уу. (${rows.length} мөр)</div>`;
  const selects = {};
  const guessMap = {
    code: ['asset number','item code','number','код','code'],
    name: ['asset description','анхны нэр','description','нэр','name'],
    revisedName: ['зассан нэр','revised','corrected'],
    spec: ['үзүүлэлт','spec','parameter','параметр'],
    equipment: ['тоноглол','equipment','asset','хамаарах'],
    assetGroup: ['asset group','group','бүлэг'],
    assetGroupDesc: ['group description','group desc','бүлгийн тайлбар'],
    assetCategory: ['asset category','category','ангилал'],
    processArea: ['process area','process','байршил','талбай'],
    department: ['санал болгож','алба нэгж','department','хариуцах','хуваарилах'],
    min: ['min qty','min','хамгийн бага'],
    max: ['max qty','max','хамгийн их'],
    uom: ['uom','unit','нэгж'],
    criticality: ['чухал','criticality','priority','зэрэглэл'],
    note: ['тайлбар','note','comment'],
  };
  fields.forEach(([key,label])=>{
    const colDiv = document.createElement('div'); colDiv.className='col';
    colDiv.innerHTML = `<label>${label}</label>`;
    const sel = document.createElement('select');
    sel.innerHTML = '<option value="">-- сонгох --</option>' + cols.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    const keywords = guessMap[key]||[key];
    const guess = cols.find(c=>keywords.some(k=>norm(c).includes(k)));
    if(guess) sel.value = guess;
    colDiv.appendChild(sel);
    modal.appendChild(colDiv);
    selects[key] = sel;
  });
  const btnRow = document.createElement('div'); btnRow.className='row'; btnRow.style.justifyContent='flex-end';
  const cancel = document.createElement('button'); cancel.className='btn ghost'; cancel.textContent='Цуцлах'; cancel.onclick=()=>bg.remove();
  const ok = document.createElement('button'); ok.className='btn'; ok.textContent='Импортлох';
  ok.onclick = async ()=>{
    const mapping = {}; fields.forEach(([key])=>mapping[key]=selects[key].value);
    if(!mapping.code || !mapping.name){ toast('Код, Нэр багана заавал сонгоно уу'); return; }
    ok.disabled = true; ok.textContent = 'Импортлож байна...';
    await runImport(kind, mapping, rows);
    bg.remove();
  };
  btnRow.append(cancel, ok);
  modal.appendChild(btnRow);
  bg.appendChild(modal);
  root.appendChild(bg);
}

const REMOVE_KEYWORDS = ["хасах","давхард","хэрэглэхгүй","утгах","байхгүй","ашиглахгүй","шаардлагагүй"];
function detectStatus(note){
  const n = norm(note);
  if(!n) return 'needs_review';
  return REMOVE_KEYWORDS.some(k=>n.includes(k)) ? 'remove_pending' : 'needs_review';
}

async function runImport(kind, mapping, rows){
  const BATCH = 300;
  if(kind==='father'){
    const existingCodes = new Set(state.fatherAssets.map(a=>a.code));
    const toInsert = [];
    rows.forEach(r=>{
      const code = (r[mapping.code]||'').toString().trim();
      const name = (r[mapping.name]||'').toString().trim();
      if(!code || existingCodes.has(code)) return;
      const suggestedRaw = mapping.department ? (r[mapping.department]||'').toString().trim() : '';
      const matchedDept = state.departments.find(d=>norm(d.name)===norm(suggestedRaw));
      toInsert.push({
        id: uid(), code, name,
        asset_group: mapping.assetGroup ? (r[mapping.assetGroup]||'').toString().trim() : '',
        asset_group_desc: mapping.assetGroupDesc ? (r[mapping.assetGroupDesc]||'').toString().trim() : '',
        asset_category: mapping.assetCategory ? (r[mapping.assetCategory]||'').toString().trim() : '',
        process_area: mapping.processArea ? (r[mapping.processArea]||'').toString().trim() : '',
        department: matchedDept ? matchedDept.name : null,
        source: 'import',
      });
      existingCodes.add(code);
    });
    let imported=0;
    for(let i=0;i<toInsert.length;i+=BATCH){
      const chunk = toInsert.slice(i,i+BATCH);
      const { error } = await sb.from('father_assets').insert(chunk);
      if(error){ toast('Импортын алдаа: '+error.message); break; }
      state.fatherAssets.push(...chunk);
      imported+=chunk.length;
    }
    const assigned = toInsert.filter(x=>x.department).length;
    const unassigned = toInsert.length - assigned;
    toast(`${imported} father asset импортлогдлоо (${assigned} хуваарилагдсан, ${unassigned} хуваарилагдаагүй)`);
  } else {
    const existingCodes = new Set(state.items.map(i=>i.code));
    const toInsert = [];
    rows.forEach(r=>{
      const code = (r[mapping.code]||'').toString().trim();
      const name = (r[mapping.name]||'').toString().trim();
      if(!code || existingCodes.has(code)) return;
      const note = mapping.note ? (r[mapping.note]||'').toString().trim() : '';
      const suggestedRaw = mapping.department ? (r[mapping.department]||'').toString().trim() : '';
      const matchedDept = state.departments.find(d=>norm(d.name)===norm(suggestedRaw));
      toInsert.push({
        id: uid(), code, name,
        revised_name: mapping.revisedName ? (r[mapping.revisedName]||'').toString().trim() : '',
        spec: mapping.spec ? (r[mapping.spec]||'').toString().trim() : '',
        equipment: mapping.equipment ? (r[mapping.equipment]||'').toString().trim() : '',
        uom: mapping.uom ? (r[mapping.uom]||'').toString().trim() : '',
        min: mapping.min ? (r[mapping.min]||'').toString().trim() : '',
        max: mapping.max ? (r[mapping.max]||'').toString().trim() : '',
        criticality: mapping.criticality ? (r[mapping.criticality]||'').toString().trim() : '',
        department: matchedDept ? matchedDept.name : null,
        suggested_department: suggestedRaw,
        status: detectStatus(note),
        note: note,
        transaction_type: 'Create',
        org_code: 'MMC',
        item_status: 'Active',
        source_system: 'Legacy',
      });
      existingCodes.add(code);
    });
    let imported=0;
    for(let i=0;i<toInsert.length;i+=BATCH){
      const chunk = toInsert.slice(i,i+BATCH);
      const { error } = await sb.from('items').insert(chunk);
      if(error){ toast('Импортын алдаа: '+error.message); break; }
      state.items.push(...chunk);
      imported+=chunk.length;
    }
    toast(`${toInsert.length} item импортлогдлоо`);
  }
  render();
}

function ensureDept(app, subtitle){
  if(session.role==='manager'){
    state.currentDept = session.deptName;
    return true;
  }
  const sel = card('Алба нэгжээ сонгоно уу', subtitle||'Дараа нь тухайн алба нэгжийн ажлыг гүйцэтгэнэ.');
  const row = document.createElement('div'); row.className='row';
  const s = document.createElement('select'); s.style.minWidth='260px';
  s.innerHTML = '<option value="">-- сонгох --</option>' + state.departments.map(d=>`<option ${state.currentDept===d.name?'selected':''} value="${escapeHtml(d.name)}">${escapeHtml(d.name)}</option>`).join('');
  s.onchange = ()=>{ state.currentDept = s.value || null; render(); };
  row.appendChild(s);

  if(!state.currentDept){
    app.appendChild(el('div','empty','Ажиллах алба нэгжээ сонгоно уу'));
    return false;
  }
  return true;
}

    const hint = document.createElement('div');
    hint.style.cssText='font-size:12px;color:var(--accent);margin-bottom:8px;';
    hint.textContent=`ℹ️ "Item шалгах" табд таны алба нэгжид санал болгосон ${unclaimedSuggested} item эзэмшигчгүй байна — "Манай албаных" дарж авна уу.`;
    c.appendChild(hint);
  }

  // Progress chips
  c.appendChild(myProgressBanner(deptName));
  return c;
}

// ================= ASSET TAB =================
function renderAssetTab(app){
  if(!ensureDept(app, 'Asset шалгаж, child asset болгож задлах.')) return;
  const dept = state.currentDept;

  if(session.role==='manager'){
    const b = card(`Таны алба нэгж: ${dept} — Asset шалгах`, 'Доорх дарааллаар: (1) өөрийн asset-аа claim хий, (2) дутуу бол нэм, (3) child asset болгож задал.');
    b.appendChild(myProgressBanner(dept));
    app.appendChild(b);
  }
  app.appendChild(mySummaryCard(dept));

  // ---- Эзэмшигчгүй assets ----
  const unclaimed = state.fatherAssets.filter(a=>!a.department);
  if(unclaimed.length>0){
    const unclaimedCard = card(`1. Эзэмшигчгүй Father Asset (${unclaimed.length})`, 'Өөрт хамаарах asset-ыг хайж "Манай албаных" дарж ав. Asset Group, Category, Process Area-г ашиглан шүүнэ.');

    // Filter bar
    const filterBar = document.createElement('div'); filterBar.style.cssText='display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;';
    const searchIn = document.createElement('input'); searchIn.type='text'; searchIn.placeholder='Код/Нэр хайх...'; searchIn.style.flex='1';
    const allGroups=['-- Бүх Group --',...new Set(unclaimed.map(a=>a.asset_group||'').filter(Boolean))];
    const allCats=['-- Бүх Category --',...new Set(unclaimed.map(a=>a.asset_category||'').filter(Boolean))];
    const allAreas=['-- Бүх Process Area --',...new Set(unclaimed.map(a=>a.process_area||'').filter(Boolean))];
    const grpSel = document.createElement('select');
    grpSel.innerHTML = allGroups.map(g=>`<option>${escapeHtml(g)}</option>`).join('');
    const catSel = document.createElement('select');
    catSel.innerHTML = allCats.map(g=>`<option>${escapeHtml(g)}</option>`).join('');
    const areaSel = document.createElement('select');
    areaSel.innerHTML = allAreas.map(g=>`<option>${escapeHtml(g)}</option>`).join('');
    filterBar.append(searchIn, grpSel, catSel, areaSel);
    unclaimedCard.appendChild(filterBar);

    const listWrap = document.createElement('div'); unclaimedCard.appendChild(listWrap);
    function drawUnclaimed(){
      const f=norm(searchIn.value);
      const grp=grpSel.value; const cat=catSel.value; const area=areaSel.value;
      const filtered = unclaimed.filter(a=>{
        if(f && !norm(a.code).includes(f) && !norm(a.name).includes(f)) return false;
        if(grp && !grp.includes('Бүх') && a.asset_group!==grp) return false;
        if(cat && !cat.includes('Бүх') && a.asset_category!==cat) return false;
        if(area && !area.includes('Бүх') && a.process_area!==area) return false;
        return true;
      });
      const t = document.createElement('table');
      t.innerHTML = '<tr><th>Код</th><th>Нэр</th><th>Asset Group</th><th>Category</th><th>Process Area</th><th></th></tr>' +
        filtered.slice(0,200).map(a=>`<tr>
          <td style="font-family:var(--mono);white-space:nowrap">${escapeHtml(a.code)}</td>
          <td>${escapeHtml(a.name)}</td>
          <td class="link-note">${escapeHtml(a.asset_group||'')}</td>
          <td class="link-note">${escapeHtml(a.asset_category||'')}</td>
          <td class="link-note">${escapeHtml(a.process_area||'')}</td>
          <td><button class="btn small" data-id="${a.id}">Манай албаных</button></td>
        </tr>`).join('');
      listWrap.innerHTML=''; listWrap.appendChild(t);
      t.querySelectorAll('button[data-id]').forEach(b=>{
        b.onclick = async ()=>{
          const it = state.fatherAssets.find(x=>x.id===b.dataset.id);
          await dbUpdate('father_assets', it.id, {department:dept});
          it.department=dept; render();
        };
      });
      if(filtered.length>200) listWrap.appendChild(el('div','link-note',`+ дахин ${filtered.length-200} мөр, хайлтаа нарийсга`));
    }
    drawUnclaimed();
    [searchIn,grpSel,catSel,areaSel].forEach(el2=>{ el2.oninput=drawUnclaimed; el2.onchange=drawUnclaimed; });
    app.appendChild(unclaimedCard);
  }

  // ---- Дутуу нэмэх ----
  const addCard = card('2. Дутуу Asset нэмэх', 'Excel-ийн мэдээлэл дээрээ үндэслэн Asset Group Description сонгоход, Asset Group, Asset Category, Process Area автоматаар орно.');

  // Build the form
  const grid = document.createElement('div');
  grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;';

  // 1. Asset Group Description (PRIMARY - REQUIRED)
  const descDiv = document.createElement('div');
  const descLbl = document.createElement('label');
  descLbl.textContent = 'Asset Group Description *';
  descLbl.style.cssText='font-size:11px;color:var(--sub);display:block;margin-bottom:3px;font-weight:700;';
  const descSel = document.createElement('select');
  descSel.style.width='100%';
  descSel.innerHTML = '<option value="">-- Excel-ээс сонго --</option>' +
    (typeof ASSET_LOOKUP !== 'undefined' 
      ? Object.keys(ASSET_LOOKUP).sort().map(d=>`<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`).join('')
      : '');
  descDiv.append(descLbl, descSel);
  grid.appendChild(descDiv);

  // 2. Asset Group Code (AUTO-FILL, READ-ONLY)
  const codeDiv = document.createElement('div');
  const codeLbl = document.createElement('label');
  codeLbl.textContent = 'Asset Group (автоматаар) *';
  codeLbl.style.cssText='font-size:11px;color:var(--sub);display:block;margin-bottom:3px;font-weight:700;';
  const codeInp = document.createElement('input');
  codeInp.type='text';
  codeInp.placeholder='автоматаар сөлөрнө';
  codeInp.readOnly=true;
  codeInp.style.cssText='background:var(--panel2);opacity:.7;';
  codeDiv.append(codeLbl, codeInp);
  grid.appendChild(codeDiv);

  // 3. Asset Category (AUTO-FILL)
  const catDiv = document.createElement('div');
  const catLbl = document.createElement('label');
  catLbl.textContent = 'Asset Category (автоматаар) *';
  catLbl.style.cssText='font-size:11px;color:var(--sub);display:block;margin-bottom:3px;font-weight:700;';
  const catInp = document.createElement('input');
  catInp.type='text';
  catInp.placeholder='автоматаар сөлөрнө';
  catInp.readOnly=true;
  catInp.style.cssText='background:var(--panel2);opacity:.7;';
  catDiv.append(catLbl, catInp);
  grid.appendChild(catDiv);

  // 4. Asset Description (MANUAL INPUT - REQUIRED)
  const assetDescDiv = document.createElement('div');
  const assetDescLbl = document.createElement('label');
  assetDescLbl.textContent = 'Asset Description (гараар) *';
  assetDescLbl.style.cssText='font-size:11px;color:var(--sub);display:block;margin-bottom:3px;font-weight:700;';
  const assetDescInp = document.createElement('input');
  assetDescInp.type='text';
  assetDescInp.placeholder='Нэр бич (жишээ: Crane/Hoist|Power Plant|ACC 3)';
  assetDescDiv.append(assetDescLbl, assetDescInp);
  grid.appendChild(assetDescDiv);

  // 5. Process Area (AUTO-FILL FROM LOOKUP)
  const areaDiv = document.createElement('div');
  const areaLbl = document.createElement('label');
  areaLbl.textContent = 'Process Area (автоматаар) *';
  areaLbl.style.cssText='font-size:11px;color:var(--sub);display:block;margin-bottom:3px;font-weight:700;';
  const areaSel = document.createElement('select');
  areaSel.style.width='100%';
  areaSel.innerHTML = '<option value="">-- сонго --</option>';
  areaDiv.append(areaLbl, areaSel);
  grid.appendChild(areaDiv);

  // AUTO-FILL LOGIC
  descSel.onchange = ()=>{
    const desc = descSel.value;
    if(typeof ASSET_LOOKUP === 'undefined' || !desc){
      codeInp.value = '';
      catInp.value = '';
      areaSel.innerHTML = '<option value="">-- сонго --</option>';
      return;
    }

    const lookup = ASSET_LOOKUP[desc];
    if(!lookup) return;

    // Set Asset Group Code and Category
    codeInp.value = lookup.code || '';
    catInp.value = lookup.category || '';

    // Set Process Area dropdown
    areaSel.innerHTML = '<option value="">-- сонго --</option>' +
      (lookup.process_areas || []).map(pa=>`<option value="${escapeHtml(pa)}">${escapeHtml(pa)}</option>`).join('');
    
    // Auto-select first process area if only one
    if(lookup.process_areas && lookup.process_areas.length === 1){
      areaSel.value = lookup.process_areas[0];
    }
  };

  addCard.appendChild(grid);

  // ADD BUTTON
  const addBtn = document.createElement('button');
  addBtn.className='btn';
  addBtn.textContent='+ Asset нэмэх';
  addBtn.onclick = async ()=>{
    const validateEmpty = (val, fieldName)=>{
      if(!val.trim()){ toast(`${fieldName} заавал сонгоно уу`); return false; }
      return true;
    };

    if(!validateEmpty(descSel.value, 'Asset Group Description')) { descSel.focus(); return; }
    if(!validateEmpty(codeInp.value, 'Asset Group Code')) return;
    if(!validateEmpty(catInp.value, 'Asset Category')) return;
    if(!validateEmpty(assetDescInp.value, 'Asset Description')) { assetDescInp.focus(); return; }
    if(!validateEmpty(areaSel.value, 'Process Area')) { areaSel.focus(); return; }

    addBtn.disabled=true; 
    const origText = addBtn.textContent;
    addBtn.textContent='⏳ Хадгалж байна...';

    const row = {
      id: uid(),
      code: '', // no code
      name: assetDescInp.value.trim(),
      asset_group: codeInp.value.trim(),
      asset_group_desc: descSel.value.trim(),
      asset_category: catInp.value.trim(),
      process_area: areaSel.value.trim(),
      department: dept,
      source: 'manual'
    };

    const {error} = await dbInsert('father_assets', row);
    if(error){ 
      toast('❌ Алдаа: '+error.message); 
      addBtn.disabled=false; 
      addBtn.textContent=origText; 
      return; 
    }

    state.fatherAssets.push(row);
    toast('✅ Asset нэмэгдлээ');
    // Reset form
    descSel.value=''; codeInp.value=''; catInp.value=''; assetDescInp.value=''; areaSel.innerHTML='<option value="">-- сонго --</option>';
    addBtn.disabled=false; 
    addBtn.textContent=origText;
    render();
  };
  addCard.appendChild(addBtn);
  app.appendChild(addCard);

  // ---- Миний asset-ууд (TABLE LIST) ----
  const mine = state.fatherAssets.filter(a=>a.department===dept);
  const mineCard = card(`3. Миний Asset-ууд (${mine.length}) → Child asset болгож задлах`, 'Доорх жагсаалтаас asset сонгоод "▶ Child нэмэх" дарж child asset нэмнэ.');
  if(mine.length===0){ mineCard.appendChild(el('div','empty','Одоогоор эзэмшдэг asset алга')); app.appendChild(mineCard); return; }

  // Search filter (if many)
  if(mine.length>5){
    const mf = document.createElement('input'); mf.type='text'; mf.placeholder='Хайх (код/нэр)...'; 
    mf.style.cssText='width:100%;margin-bottom:10px;padding:8px 10px;font-size:13px;';
    mineCard.appendChild(mf);
    
    const mineListWrap = document.createElement('div'); mineCard.appendChild(mineListWrap);
    
    function drawMine(){
      const f=norm(mf.value);
      const filtered=mine.filter(a=>!f||norm(a.code||'').includes(f)||norm(a.name).includes(f)||norm(a.asset_group_desc||'').includes(f));
      mineListWrap.innerHTML='';
      
      const table = document.createElement('table');
      table.style.fontSize='12px';
      table.innerHTML=`<tr>
        <th style="text-align:left">Asset Code</th>
        <th>Asset Description</th>
        <th>Asset Group</th>
        <th>Asset Category</th>
        <th>Process Area</th>
        <th>Child</th>
        <th></th>
      </tr>`;
      
      filtered.forEach(fa=>{
        const childCount = state.childAssets.filter(c=>c.father_id===fa.id).length;
        const tr = document.createElement('tr');
        tr.style.cursor='pointer';
        tr.onmouseenter=()=>tr.style.background='var(--panel2)';
        tr.onmouseleave=()=>tr.style.background='';
        
        tr.innerHTML=`
          <td style="font-family:var(--mono);font-size:11px">${escapeHtml(fa.code||'')}</td>
          <td style="font-weight:500">${escapeHtml(fa.name)}</td>
          <td>${escapeHtml(fa.asset_group||'')}</td>
          <td class="link-note">${escapeHtml(fa.asset_category||'')}</td>
          <td class="link-note">${escapeHtml(fa.process_area||'')}</td>
          <td style="text-align:center;color:var(--accent2);font-weight:700">${childCount}</td>
          <td style="text-align:center">
            <button class="btn ghost small" style="font-size:11px">▶ Child нэмэх</button>
          </td>
        `;
        
        // Expand detail on button click
        const expandBtn = tr.querySelector('button');
        expandBtn.onclick = (e)=>{
          e.stopPropagation();
          if(!state.openAssets) state.openAssets = new Set();
          if(state.openAssets.has(fa.id)) state.openAssets.delete(fa.id);
          else state.openAssets.add(fa.id);
          render();
        };
        
        table.appendChild(tr);
      });
      
      mineListWrap.appendChild(table);
    }
    
    mf.oninput=drawMine;
    drawMine();
  } else {
    // No search needed - show table directly
    const table = document.createElement('table');
    table.style.fontSize='12px';
    table.innerHTML=`<tr>
      <th style="text-align:left">Asset Code</th>
      <th>Asset Description</th>
      <th>Asset Group</th>
      <th>Asset Category</th>
      <th>Process Area</th>
      <th>Child</th>
      <th></th>
    </tr>`;
    
    mine.forEach(fa=>{
      const childCount = state.childAssets.filter(c=>c.father_id===fa.id).length;
      const tr = document.createElement('tr');
      tr.style.cursor='pointer';
      tr.onmouseenter=()=>tr.style.background='var(--panel2)';
      tr.onmouseleave=()=>tr.style.background='';
      
      tr.innerHTML=`
        <td style="font-family:var(--mono);font-size:11px">${escapeHtml(fa.code||'')}</td>
        <td style="font-weight:500">${escapeHtml(fa.name)}</td>
        <td>${escapeHtml(fa.asset_group||'')}</td>
        <td class="link-note">${escapeHtml(fa.asset_category||'')}</td>
        <td class="link-note">${escapeHtml(fa.process_area||'')}</td>
        <td style="text-align:center;color:var(--accent2);font-weight:700">${childCount}</td>
        <td style="text-align:center">
          <button class="btn ghost small" style="font-size:11px">▶ Child нэмэх</button>
        </td>
      `;
      
      const expandBtn = tr.querySelector('button');
      expandBtn.onclick = (e)=>{
        e.stopPropagation();
        if(!state.openAssets) state.openAssets = new Set();
        if(state.openAssets.has(fa.id)) state.openAssets.delete(fa.id);
        else state.openAssets.add(fa.id);
        render();
      };
      
      table.appendChild(tr);
    });
    
    mineCard.appendChild(table);
  }
  
  app.appendChild(mineCard);
  
  // ---- Expanded detail views (stacked below list) ----
  const openAssets = state.openAssets || new Set();
  mine.forEach(fa=>{
    if(openAssets.has(fa.id)){
      app.appendChild(renderFatherAssetBlock(fa, dept));
    }
  });
}

// ================= ITEM TAB =================
function renderItemTab(app){
  if(!ensureDept(app, 'Item (Spare parts) шалгаж баталгаажуулах.')) return;
  const dept = state.currentDept;

  if(session.role==='manager'){
    const b = card(`Таны алба нэгж: ${dept} — Item (Spare parts) шалгах`, 'Жагсаалтад буруу мэдээлэл байвал шууд засаж болно. Төлөвийг тохируулж "Идэвхтэй" болгоно.');
    b.appendChild(myProgressBanner(dept));
    app.appendChild(b);
  }
  app.appendChild(mySummaryCard(dept));

  // ---- Миний Item-ууд — шинэ table view ----
  const myItems = state.items.filter(it=>it.department===dept);
  const activeN = myItems.filter(it=>it.status==='active').length;
  const removeN = myItems.filter(it=>it.status==='remove_pending'||it.status==='removed').length;
  const reviewN = myItems.filter(it=>it.status==='needs_review').length;

  const miCard = card(`Миний Item-үүд (${myItems.length})`, `✓ Идэвхтэй: ${activeN} | ✕ Хасах: ${removeN} | ? Шалгаагүй: ${reviewN}`);

  if(myItems.length > 0){
    // Status filter chips
    const chipWrap = document.createElement('div'); chipWrap.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;';
    let activeFilter = 'all';
    const chips = [
      ['all','Бүгд', myItems.length],
      ['needs_review','Шалгаагүй', reviewN],
      ['active','Идэвхтэй', activeN],
      ['remove_pending','Хасах санал', myItems.filter(it=>it.status==='remove_pending').length],
      ['removed','Устгасан', myItems.filter(it=>it.status==='removed').length],
    ];
    const searchI = document.createElement('input'); searchI.type='text'; searchI.placeholder='Код/Нэр хайх...'; searchI.style.cssText='width:100%;margin-bottom:8px;';
    miCard.appendChild(searchI);
    chips.forEach(([val,label,cnt])=>{
      const ch = document.createElement('button'); ch.className='btn ghost small';
      ch.textContent=`${label} (${cnt})`; ch.style.fontWeight = val==='all'?'700':'normal';
      ch.onclick=()=>{ activeFilter=val; drawItemTable(); chips.forEach((c2,i2)=>{chipWrap.children[i2].style.fontWeight=c2[0]===val?'700':'normal';}); };
      chipWrap.appendChild(ch);
    });
    miCard.appendChild(chipWrap);

    const tableWrap = document.createElement('div'); tableWrap.style.overflowX='auto';
    miCard.appendChild(tableWrap);

    function drawItemTable(){
      const f = norm(searchI.value);
      const filtered = myItems.filter(it=>{
        if(f && !norm(it.code).includes(f) && !norm(it.name).includes(f) && !norm(it.equipment||'').includes(f)) return false;
        if(activeFilter!=='all' && it.status!==activeFilter) return false;
        return true;
      });
      const statusLabel={active:'✓ Идэвхтэй',removed:'✕ Устгасан',remove_pending:'! Хасах санал',needs_review:'? Шалгаагүй'};
      const statusColor={active:'var(--accent2)',removed:'var(--danger)',remove_pending:'#f0a500',needs_review:'var(--sub)'};
      const t = document.createElement('table');
      t.style.fontSize='12px';
      t.innerHTML=`<tr>
        <th>#</th><th>Код</th><th>Нэр</th><th>Үзүүлэлт</th><th>Тоноглол</th>
        <th>UOM</th><th>Min</th><th>Max</th><th>Чухал</th>
        <th>Segment</th><th>Family</th><th>Class</th><th>Commodity (UNSPSC)</th>
        <th>Төлөв</th><th></th>
      </tr>`;
      filtered.slice(0,300).forEach((it,idx)=>{
        const u = getUnspsc(it.code) || {};
        const tr = document.createElement('tr');
        const stColor = statusColor[it.status]||'var(--sub)';
        tr.innerHTML=`
          <td style="color:var(--sub)">${idx+1}</td>
          <td style="font-family:var(--mono);white-space:nowrap;font-size:11px">${escapeHtml(it.code)}</td>
          <td><input type="text" value="${escapeHtml(it.name||'')}" style="width:180px" data-id="${it.id}" data-field="name"></td>
          <td><input type="text" value="${escapeHtml(it.spec||'')}" style="width:120px" data-id="${it.id}" data-field="spec" placeholder="Үзүүлэлт"></td>
          <td><input type="text" value="${escapeHtml(it.equipment||'')}" style="width:120px" data-id="${it.id}" data-field="equipment" placeholder="Тоноглол"></td>
          <td><input type="text" value="${escapeHtml(it.uom||'')}" style="width:60px" data-id="${it.id}" data-field="uom"></td>
          <td><input type="text" value="${escapeHtml(it.min||'')}" style="width:50px" data-id="${it.id}" data-field="min"></td>
          <td><input type="text" value="${escapeHtml(it.max||'')}" style="width:50px" data-id="${it.id}" data-field="max"></td>
          <td><select data-id="${it.id}" data-field="criticality" style="width:60px">
            <option value="">--</option>
            ${['P1','P2','P3'].map(p=>`<option ${it.criticality===p?'selected':''}>${p}</option>`).join('')}
          </select></td>
          <td class="link-note" style="font-size:10px;max-width:120px">${escapeHtml(u.segment||'')}</td>
          <td class="link-note" style="font-size:10px;max-width:120px">${escapeHtml(u.family||'')}</td>
          <td class="link-note" style="font-size:10px;max-width:120px">${escapeHtml(u.cls||'')}</td>
          <td style="font-size:11px;color:var(--accent2);font-weight:600;max-width:150px">${escapeHtml(u.commodity||'')}</td>
          <td><select data-id="${it.id}" data-field="status" style="width:130px;color:${stColor}">
            <option value="needs_review" ${it.status==='needs_review'?'selected':''}>? Шалгаагүй</option>
            <option value="active" ${it.status==='active'?'selected':''}>✓ Идэвхтэй</option>
            <option value="remove_pending" ${it.status==='remove_pending'?'selected':''}>! Хасах санал</option>
            <option value="removed" ${it.status==='removed'?'selected':''}>✕ Устгасан</option>
          </select></td>
          <td style="color:var(--sub);font-size:10px">${it.note?'📝':''}</td>`;
        t.appendChild(tr);
      });
      tableWrap.innerHTML=''; tableWrap.appendChild(t);
      if(filtered.length>300) tableWrap.appendChild(el('div','link-note',`+ дахин ${filtered.length-300} мөр, хайлтаа нарийсга`));

      // Inline edit handlers
      t.querySelectorAll('input[data-id],select[data-id]').forEach(inp=>{
        inp.onchange = async ()=>{
          const id=inp.dataset.id; const field=inp.dataset.field; const val=inp.value;
          const it2=state.items.find(x=>x.id===id); if(!it2) return;
          if(field==='status' && val==='active'){
            if(!it2.uom){ toast('UOM заавал бөглөнө'); inp.value=it2.status; return; }
          }
          it2[field]=val;
          await dbUpdate('items', id, {[field]:val});
          if(field==='status') drawItemTable(); // refresh status colors
        };
      });
    }
    drawItemTable();
    searchI.oninput = drawItemTable;
  } else {
    miCard.appendChild(el('div','empty','Танд хуваарилагдсан item алга байна. Item шалгах → "Эзэмшигчгүй Item"-с claim хийнэ үү.'));
  }
  app.appendChild(miCard);

  // ---- Эзэмшигчгүй item (claim хийх) ----
  const unclaimedItems = state.items.filter(it=>!it.department);
  if(unclaimedItems.length>0){
    const uiCard = card(`Эзэмшигчгүй Item (${unclaimedItems.length})`, 'Алба нэгж тодорхойгүй item-үүд. Өөрт хамаарахыг хайж "Манай албаных" дарж ав.');
    const searchU = document.createElement('input'); searchU.type='text'; searchU.placeholder='Хайх (код/нэр/тоноглол)...'; searchU.style.cssText='width:100%;margin-bottom:10px;';
    uiCard.appendChild(searchU);
    const listWrap = document.createElement('div'); uiCard.appendChild(listWrap);
    function drawUnclaimed(){
      const f=norm(searchU.value);
      const filtered=unclaimedItems.filter(it=>!f||norm(it.code).includes(f)||norm(it.name).includes(f)||norm(it.equipment||'').includes(f)||norm(it.suggested_department||'').includes(f));
      const t=document.createElement('table');
      t.style.fontSize='12px';
      t.innerHTML='<tr><th>Код</th><th>Нэр</th><th>Тоноглол</th><th>UOM</th><th>Min/Max</th><th>Segment → Commodity</th><th>Санал болгосон</th><th>Төлөв</th><th></th></tr>'+
        filtered.slice(0,200).map(it=>{
          const u = getUnspsc(it.code) || {};
          const catStr = u.commodity ? `${escapeHtml(u.segment||'')} › ${escapeHtml(u.cls||'')} › <strong>${escapeHtml(u.commodity)}</strong>` : '';
          const removeTag=it.status==='remove_pending'?'<span class="tag dup" style="font-size:10px">Хасах санал</span>':'';
          return `<tr>
            <td style="font-family:var(--mono);font-size:11px;white-space:nowrap">${escapeHtml(it.code)}</td>
            <td>${escapeHtml(it.name)}</td>
            <td class="link-note">${escapeHtml(it.equipment||'')}</td>
            <td>${escapeHtml(it.uom||'')}</td>
            <td>${escapeHtml(it.min||'')}/${escapeHtml(it.max||'')}</td>
            <td style="font-size:11px;max-width:200px">${catStr}</td>
            <td class="link-note">${escapeHtml(it.suggested_department||'')}</td>
            <td>${removeTag}</td>
            <td><button class="btn small" data-id="${it.id}">Манай албаных</button></td>
          </tr>`;
        }).join('');
      listWrap.innerHTML=''; listWrap.appendChild(t);
      t.querySelectorAll('button[data-id]').forEach(b=>{
        b.onclick=async()=>{
          const it2=state.items.find(x=>x.id===b.dataset.id);
          await dbUpdate('items',it2.id,{department:dept}); it2.department=dept; render();
        };
      });
      if(filtered.length>200) listWrap.appendChild(el('div','link-note',`+ дахин ${filtered.length-200} мөр`));
    }
    drawUnclaimed(); searchU.oninput=drawUnclaimed;
    app.appendChild(uiCard);
  }
}

    ['source_system','Source System Code','text'],

function renderFatherAssetBlock(fa, dept){

  const isOpen = state.openAssets && state.openAssets.has(fa.id);

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
      <span style="font-size:12px;color:var(--sub)">${isOpen?'▼':'▶'}</span>

      ${fa.process_area?`<span style="background:var(--panel2);padding:2px 8px;border-radius:4px;color:var(--sub)">📍 ${escapeHtml(fa.process_area)}</span>`:''}
      <span style="background:var(--panel2);padding:2px 8px;border-radius:4px;color:var(--sub)">Child: ${state.childAssets.filter(c=>c.father_id===fa.id).length}</span>
    </div>`;

  const btnGroup = document.createElement('div'); btnGroup.style.cssText='display:flex;gap:6px;flex-shrink:0;margin-left:10px;';
  const unclaimBtn = document.createElement('button'); unclaimBtn.className='btn ghost small'; unclaimBtn.textContent='Буцаах';
  unclaimBtn.onclick = async (e)=>{ e.stopPropagation(); await dbUpdate('father_assets', fa.id, {department:null}); fa.department=null; render(); };
  btnGroup.appendChild(unclaimBtn);

  head.append(info, btnGroup);
  head.onclick = ()=>{
    if(!state.openAssets) state.openAssets = new Set();
    if(state.openAssets.has(fa.id)) state.openAssets.delete(fa.id);
    else state.openAssets.add(fa.id);
    render();
  };

  if(!isOpen) return block; // collapsed — header only

  // ---- Expanded: full detail + child assets ----
  const detail = document.createElement('div');
  detail.style.cssText='margin-top:10px;padding:10px;background:var(--panel2);border-radius:6px;';

  // Full info table
  const infoTable = document.createElement('table');
  infoTable.style.cssText='font-size:12px;margin-bottom:10px;width:100%';
  infoTable.innerHTML = [
    ['Asset Number', fa.code],
    ['Asset Description', fa.name],
    ['Asset Group', fa.asset_group],
    ['Group Description', fa.asset_group_desc],
    ['Asset Category', fa.asset_category],
    ['Process Area', fa.process_area],
  ].filter(([,v])=>v).map(([k,v])=>`<tr><td style="color:var(--sub);width:160px;padding:3px 0">${k}</td><td style="color:var(--text);font-weight:500">${escapeHtml(v||'')}</td></tr>`).join('');
  detail.appendChild(infoTable);

  // ---- Child assets ----
  const children = state.childAssets.filter(c=>c.father_id===fa.id);
  const childTitle = document.createElement('div');
  childTitle.style.cssText='font-size:11px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding-top:8px;border-top:1px solid var(--line);';
  childTitle.textContent=`Child Asset-ууд (${children.length}) — BOM-д холбогдох бодит тоног төхөөрөмж`;
  detail.appendChild(childTitle);

  if(children.length===0){
    detail.appendChild(el('div','link-note','Одоогоор child asset алга — доор нэмнэ үү'));
  }
  children.forEach(c=>detail.appendChild(renderChildAsset(c)));

  // ---- Child нэмэх ----
  const addTitle = document.createElement('div');
  addTitle.style.cssText='font-size:12px;color:var(--accent);font-weight:600;margin-top:12px;margin-bottom:6px;';
  addTitle.textContent='➕ Шинэ Child Asset нэмэх';
  const addNote = document.createElement('div');
  addNote.style.cssText='font-size:11px;color:var(--sub);margin-bottom:8px;';
  addNote.textContent='Жишээ: "Boiler #1 Feed Pump", "SA Fan #1" — нэг хүснэгтийн нэг мөр = нэг бодит машин/хэсэг';
  detail.appendChild(addTitle);
  detail.appendChild(addNote);

  const row1 = document.createElement('div'); row1.style.cssText='display:flex;gap:8px;align-items:center;';
  const cName = document.createElement('input'); cName.type='text';
  cName.placeholder='Child asset нэр (жишээ: SA Fan #1)';
  cName.style.cssText='flex:1;font-size:13px;';
  const cQty = document.createElement('input'); cQty.type='number';
  cQty.placeholder='Тоо'; cQty.style.width='70px'; cQty.value='1';
  const cBtn = document.createElement('button'); cBtn.className='btn';
  cBtn.textContent='+ Child нэмэх'; cBtn.style.whiteSpace='nowrap';

  cBtn.onclick = async ()=>{
    const nm = cName.value.trim();
    if(!nm){ toast('Child asset-н нэрийг бичнэ үү'); cName.focus(); return; }
    cBtn.disabled=true; cBtn.textContent='Хадгалж байна...';
    const row = { id:uid(), father_id:fa.id, name:nm, qty:cQty.value||'1', department:dept };
    const {error} = await sb.from('child_assets').insert(row);
    if(error){ toast('Алдаа: '+error.message); cBtn.disabled=false; cBtn.textContent='+ Child нэмэх'; return; }
    state.childAssets.push(row);
    cName.value=''; cQty.value='1';
    cBtn.disabled=false; cBtn.textContent='+ Child нэмэх';
    render();
  };
  cName.onkeydown = e=>{ if(e.key==='Enter') cBtn.click(); };
  row1.append(cName, cQty, cBtn);
  detail.appendChild(row1);

  block.appendChild(detail);
  return block;
}

function renderChildAsset(c){
  const wrap = document.createElement('div');
  wrap.style.cssText='background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px;';
  const head = document.createElement('div'); head.className='flex-between';

  const rm = document.createElement('button'); rm.className='btn ghost small'; rm.textContent='Устгах';
  rm.onclick = async ()=>{
    await dbDelete('child_assets', c.id); // cascades links via FK
    state.childAssets = state.childAssets.filter(x=>x.id!==c.id);
    state.links = state.links.filter(l=>l.child_asset_id!==c.id);
    render();
  };
  head.appendChild(rm);
  wrap.appendChild(head);

  // Oracle FBDI fields (collapsible)
  const oracleToggle = document.createElement('button');
  oracleToggle.className='btn ghost small'; oracleToggle.style.marginTop='6px';
  oracleToggle.textContent='⚙ Oracle талбар (өртөг, элэгдэл, огноо...)';
  const oracleWrap = document.createElement('div');
  oracleWrap.style.cssText='display:none;margin-top:8px;padding:10px;background:var(--panel2);border-radius:6px;';
  oracleToggle.onclick = ()=>{ oracleWrap.style.display = oracleWrap.style.display==='none'?'block':'none'; };
  const oracleFields = [
    ['category','Asset Category (Oracle)','text'],
    ['date_in_service','Ашиглалтад орсон огноо (DD/MM/YYYY)','text'],
    ['asset_cost','Өртөг (Asset Cost)','text'],
    ['asset_type','Asset Type','select:Capitalized,CIP,Expensed'],
    ['deprn_method','Элэгдлийн арга','select:STL,Flat-Rate,Units of Production'],
    ['life_months','Ашиглалтын хугацаа (сар)','text'],
    ['location','Байршил (Location)','text'],
    ['criticality','Чухал түвшин','select:Өндөр,Дунд,Бага'],
    ['manufacturer','Manufacturer','text'],
    ['model','Model','text'],
    ['serial','Serial Number','text'],
  ];
  const grid = document.createElement('div'); grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;';
  oracleFields.forEach(([key,label,type])=>{
    const fw = document.createElement('div');
    const lb = document.createElement('label'); lb.textContent=label; lb.style.cssText='font-size:11px;color:var(--sub);display:block;margin-bottom:2px;';
    let inp;
    if(type.startsWith('select:')){
      inp = document.createElement('select');
      const opts = type.split(':')[1].split(',');
      inp.innerHTML = '<option value="">--</option>' + opts.map(o=>`<option ${c[key]===o?'selected':''}>${o}</option>`).join('');
    } else {
      inp = document.createElement('input'); inp.type='text'; inp.value=c[key]||'';
    }
    inp.style.width='100%';
    inp.onchange = async ()=>{ c[key]=inp.value; await dbUpdate('child_assets', c.id, {[key]: inp.value}); };
    fw.append(lb, inp);
    grid.appendChild(fw);
  });
  oracleWrap.appendChild(grid);
  wrap.appendChild(oracleToggle);
  wrap.appendChild(oracleWrap);
  links.forEach(l=>wrap.appendChild(renderItemLink(l)));

  const searchWrap = document.createElement('div'); searchWrap.className='search-box'; searchWrap.style.marginTop='6px';
  const sIn = document.createElement('input'); sIn.type='text'; sIn.placeholder='Item хайж холбох (код/нэр)...'; sIn.style.width='100%';
  const results = document.createElement('div'); results.className='search-results'; results.style.display='none';
  sIn.oninput = ()=>{
    const f = norm(sIn.value);
    if(!f){ results.style.display='none'; return; }
    const matches = state.items.filter(it=>it.status!=='removed' && (norm(it.code).includes(f)||norm(it.name).includes(f))).slice(0,20);
    results.innerHTML='';
    if(matches.length===0){ results.innerHTML='<div>Олдсонгүй</div>'; }
    matches.forEach(it=>{
      const d = document.createElement('div');
      d.textContent = `${it.code} — ${it.name}`;
      d.onclick = async ()=>{
        const row = { id: uid(), child_asset_id: c.id, item_id: it.id, qty:'', verified:false, corr_category:'', corr_min:'', corr_max:'', corr_uom:'' };
        await dbInsert('links', row);
        state.links.push(row);
        sIn.value=''; results.style.display='none'; render();
      };
      results.appendChild(d);
    });
    results.style.display='block';
  };
  searchWrap.append(sIn, results);
  wrap.appendChild(searchWrap);
  return wrap;
}

function renderItemLink(l){
  const it = state.items.find(x=>x.id===l.item_id);
  const wrap = document.createElement('div');
  wrap.style.cssText='background:var(--panel2);border-radius:6px;padding:8px 10px;margin:6px 0;';
  if(!it){ wrap.innerHTML = '<span class="link-note">Item олдсонгүй</span>'; return wrap; }
  const head = document.createElement('div'); head.className='flex-between';
  head.innerHTML = `<div style="font-family:var(--mono);font-size:12px">${escapeHtml(it.code)} <span style="font-family:inherit">— ${escapeHtml(it.name)}</span></div>`;
  const rmBtn = document.createElement('button'); rmBtn.className='btn ghost small'; rmBtn.textContent='×';
  rmBtn.onclick = async ()=>{ await dbDelete('links', l.id); state.links = state.links.filter(x=>x.id!==l.id); render(); };
  head.appendChild(rmBtn);
  wrap.appendChild(head);

  const fi = document.createElement('div'); fi.className='field-inline';
  const qtyLbl = document.createElement('label'); qtyLbl.textContent='Тоо ш:';
  const qtyIn = document.createElement('input'); qtyIn.type='number'; qtyIn.value=l.qty||'';
  qtyIn.onchange = async ()=>{ l.qty = qtyIn.value; await dbUpdate('links', l.id, {qty:l.qty}); };
  fi.append(qtyLbl, qtyIn);

  const fieldMap = { category:'corr_category', min:'corr_min', max:'corr_max', uom:'corr_uom' };
  Object.entries(fieldMap).forEach(([label, dbField])=>{
    const lbl = document.createElement('label'); lbl.textContent = label.toUpperCase()+':';
    const inp = document.createElement('input'); inp.type='text';
    inp.value = l[dbField] || it[label] || '';
    inp.onchange = async ()=>{ l[dbField] = inp.value; await dbUpdate('links', l.id, {[dbField]: inp.value}); };
    fi.append(lbl, inp);
  });
  wrap.appendChild(fi);

  const verifyRow = document.createElement('div'); verifyRow.style.marginTop='6px';
  const chk = document.createElement('label'); chk.style.fontSize='12px'; chk.style.cursor='pointer';
  const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=!!l.verified; cb.style.marginRight='6px';
  cb.onchange = async ()=>{ l.verified = cb.checked; await dbUpdate('links', l.id, {verified: l.verified}); render(); };
  chk.append(cb, document.createTextNode('Менежерээр баталгаажсан'));
  verifyRow.appendChild(chk);
  wrap.appendChild(verifyRow);
  return wrap;
}

// ================= MATRIX TAB =================
let matrixSelectedChildIds = [];
let matrixSelectedItemIds = [];

function renderMatrix(app){
  if(session.role==='manager') state.currentDept = session.deptName;

  // Dept picker (admin only)
  if(session.role==='admin'){
    const sel = card('Алба нэгж сонго', '');
    const row = document.createElement('div'); row.className='row';
    const s = document.createElement('select'); s.style.minWidth='260px';
    s.innerHTML = '<option value="">-- сонгох --</option>' + state.departments.map(d=>`<option ${state.currentDept===d.name?'selected':''} value="${escapeHtml(d.name)}">${escapeHtml(d.name)}</option>`).join('');
    s.onchange = ()=>{ state.currentDept = s.value||null; matrixSelectedChildIds=[]; matrixSelectedItemIds=[]; render(); };
    row.appendChild(s); sel.appendChild(row); app.appendChild(sel);
  }
  if(!state.currentDept){ app.appendChild(el('div','empty','Ажиллах алба нэгжээ сонгоно уу')); return; }

  const dept = state.currentDept;

  // ---- ТАЙЛБАР ----
  const helpCard = card('📋 BOM — Item ↔ Asset холбох заавар', '');
  helpCard.innerHTML += `<div style="font-size:13px;line-height:1.8;color:var(--sub)">
    <b style="color:var(--text)">BOM (Bill of Materials)</b> — тухайн child asset-д ямар item (сэлбэг) хэд ширхэг ашиглагддагыг бүртгэнэ.<br>
    <b style="color:var(--accent2)">Жишээ:</b> "SA Fan #1" (child asset) дотор → Bearing 6205 (2ш), V-belt A-62 (3ш), Oil seal 30×47 (1ш)<br>
    <br>
    <b>Алхам:</b>
    <ol style="padding-left:18px;margin:4px 0">
      <li>Child asset сонго (жишээ: SA Fan #1)</li>
      <li>Тухайн asset-д хамаарах item-үүдийг хайж нэм</li>
      <li>Тоо ширхэгийг бөглө → автоматаар хадгалагдана</li>
    </ol>
  </div>`;
  app.appendChild(helpCard);

  // ---- CHILD ASSET СОНГОХ ----
  const myChildren = state.childAssets.filter(c=>c.department===dept);
  if(myChildren.length===0){
    app.appendChild(card('Child Asset байхгүй байна', '"Asset шалгах" табд asset-аа нээж child asset нэмсний дараа энд ажиллана.'));
    return;
  }

  // Group by father asset
  const fatherMap = {};
  myChildren.forEach(c=>{
    const fa = state.fatherAssets.find(x=>x.id===c.father_id);
    const key = fa ? fa.id : 'unknown';
    if(!fatherMap[key]) fatherMap[key]={fa, children:[]};
    fatherMap[key].children.push(c);
  });

  const colCard = card(`1. Child Asset сонго (${dept})`, 'BOM хийх child asset-аа сонгоно уу. Father asset-аар бүлэглэсэн байна.');
  Object.values(fatherMap).forEach(({fa, children})=>{
    if(!fa) return;
    const grpTitle = document.createElement('div');
    grpTitle.style.cssText='font-size:11px;color:var(--sub);font-weight:700;margin:8px 0 4px;';
    grpTitle.textContent=`▸ ${fa.name} (${fa.code||''})`;
    colCard.appendChild(grpTitle);
    const grp = document.createElement('div'); grp.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;';
    children.forEach(c=>{
      const lbl = document.createElement('label');
      const isSelected = matrixSelectedChildIds.includes(c.id);
      lbl.style.cssText=`display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid ${isSelected?'var(--accent2)':'var(--line)'};background:${isSelected?'#1a2e22':'var(--panel2)'};`;
      const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=isSelected;
      const linkCount = state.links.filter(l=>l.child_asset_id===c.id).length;
      cb.onchange = ()=>{
        if(cb.checked) matrixSelectedChildIds.push(c.id);
        else matrixSelectedChildIds = matrixSelectedChildIds.filter(x=>x!==c.id);
        matrixSelectedItemIds=[];
        render();
      };
      lbl.append(cb, document.createTextNode(`${c.name} ${linkCount>0?`(${linkCount} item)`:''}`));
      grp.appendChild(lbl);
    });
    colCard.appendChild(grp);
  });
  app.appendChild(colCard);

  if(matrixSelectedChildIds.length===0){
    app.appendChild(el('div','empty','Дор хаяж 1 child asset сонгоно уу'));
    return;
  }

  const selectedChildren = myChildren.filter(c=>matrixSelectedChildIds.includes(c.id));

  // ---- ITEM ХАЙХ & НЭМЭХ ----
  const itemCard = card('2. Item хайж нэм', 'Энэ child asset-д хамаарах сэлбэгүүдийг хайж нэмнэ үү. Тухайн алба нэгжийн item-үүд эхэлж гарна.');
  const searchWrap = document.createElement('div'); searchWrap.style.position='relative';
  const sIn = document.createElement('input'); sIn.type='text';
  sIn.placeholder='Item код/нэр/тоноглолоор хайх...';
  sIn.style.cssText='width:100%;font-size:13px;';
  const results = document.createElement('div');
  results.style.cssText='position:absolute;top:36px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;z-index:100;max-height:240px;overflow-y:auto;display:none;';
  sIn.oninput = ()=>{
    const f = norm(sIn.value);
    if(!f){ results.style.display='none'; return; }
    // My dept items first, then others
    const myItems = state.items.filter(it=>it.status!=='removed'&&it.department===dept&&(norm(it.code).includes(f)||norm(it.name).includes(f)||norm(it.equipment||'').includes(f)));
    const otherItems = state.items.filter(it=>it.status!=='removed'&&it.department!==dept&&(norm(it.code).includes(f)||norm(it.name).includes(f)||norm(it.equipment||'').includes(f)));
    const matches = [...myItems, ...otherItems].slice(0,30);
    results.innerHTML='';
    if(matches.length===0){ results.innerHTML='<div style="padding:8px;color:var(--sub)">Олдсонгүй</div>'; }
    matches.forEach(it=>{
      const d = document.createElement('div');
      d.style.cssText='padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:12px;';
      d.onmouseenter=()=>d.style.background='var(--panel2)';
      d.onmouseleave=()=>d.style.background='';
      d.innerHTML=`<span style="font-family:var(--mono);font-size:11px;color:var(--sub)">${escapeHtml(it.code)}</span> <strong>${escapeHtml(it.name)}</strong>${it.equipment?` <span style="color:var(--sub)">/ ${escapeHtml(it.equipment)}</span>`:''}`;
      d.onclick = ()=>{
        if(!matrixSelectedItemIds.includes(it.id)) matrixSelectedItemIds.push(it.id);
        sIn.value=''; results.style.display='none'; render();
      };
      results.appendChild(d);
    });
    results.style.display='block';
  };
  document.addEventListener('click', (e)=>{ if(!searchWrap.contains(e.target)) results.style.display='none'; }, {once:false});
  searchWrap.append(sIn, results);
  itemCard.appendChild(searchWrap);
  app.appendChild(itemCard);

  // ---- BOM ХҮСНЭГТ ----
  const bomCard = card('3. BOM бөглөх — тоо ширхэг', `Сонгосон child asset: ${selectedChildren.map(c=>c.name).join(', ')}`);

  if(matrixSelectedItemIds.length===0){
    bomCard.appendChild(el('div','link-note','↑ Дээр item хайж нэмнэ үү'));
    app.appendChild(bomCard);
    return;
  }

  const selectedItems = state.items.filter(it=>matrixSelectedItemIds.includes(it.id));
  const table = document.createElement('table');
  table.style.fontSize='12px';

  // Header
  const hRow = document.createElement('tr');
  hRow.innerHTML=`<th style="text-align:left">Item (Сэлбэг)</th>`;
  selectedChildren.forEach(c=>{
    const fa=state.fatherAssets.find(x=>x.id===c.father_id);
    hRow.innerHTML+=`<th style="text-align:center;min-width:80px">${escapeHtml(c.name)}<br><span style="font-weight:400;font-size:10px;color:var(--sub)">${fa?escapeHtml(fa.name):''}</span></th>`;
  });
  hRow.innerHTML+=`<th></th>`;
  table.appendChild(hRow);

  selectedItems.forEach(it=>{
    const tr = document.createElement('tr');
    // Item info
    const tdName = document.createElement('td');
    const u=getUnspsc(it.code)||{};
    tdName.innerHTML=`
      <div><strong>${escapeHtml(it.name)}</strong></div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--sub)">${escapeHtml(it.code)}</div>
      ${it.equipment?`<div style="font-size:10px;color:var(--sub)">${escapeHtml(it.equipment)}</div>`:''}
      ${u.commodity?`<div style="font-size:10px;color:var(--accent2)">${escapeHtml(u.commodity)}</div>`:''}`;
    tr.appendChild(tdName);

    // Qty cells per child asset
    selectedChildren.forEach(c=>{
      const td = document.createElement('td'); td.style.textAlign='center';
      const existing = state.links.find(l=>l.child_asset_id===c.id&&l.item_id===it.id);
      const inp = document.createElement('input');
      inp.type='number'; inp.min='0';
      inp.style.cssText='width:70px;text-align:center;font-size:14px;font-weight:700;';
      inp.value = existing?(existing.qty||''):'';
      inp.placeholder='0';
      if(existing&&existing.qty) inp.style.background='#1a2e22';
      inp.onchange = async ()=>{
        const val=inp.value.trim();
        let link=state.links.find(l=>l.child_asset_id===c.id&&l.item_id===it.id);
        if(!val||val==='0'){
          if(link){ await dbDelete('links',link.id); state.links=state.links.filter(x=>x.id!==link.id); }
          inp.style.background=''; return;
        }
        if(link){ link.qty=val; await dbUpdate('links',link.id,{qty:val}); }
        else {
          const row={id:uid(),child_asset_id:c.id,item_id:it.id,qty:val,verified:false,corr_category:'',corr_min:'',corr_max:'',corr_uom:''};
          await dbInsert('links',row); state.links.push(row);
        }
        inp.style.background='#1a2e22';
      };
      td.appendChild(inp);
      tr.appendChild(td);
    });

    // Remove row button
    const tdRm=document.createElement('td');
    const rmBtn=document.createElement('button'); rmBtn.className='btn ghost small'; rmBtn.textContent='×';
    rmBtn.onclick=()=>{matrixSelectedItemIds=matrixSelectedItemIds.filter(x=>x!==it.id); render();};
    tdRm.appendChild(rmBtn);
    tr.appendChild(tdRm);
    table.appendChild(tr);
  });

  bomCard.appendChild(table);

  // Summary
  const totalLinks = state.links.filter(l=>selectedChildren.some(c=>c.id===l.child_asset_id)).length;
  const summ=document.createElement('div');
  summ.style.cssText='margin-top:10px;font-size:12px;color:var(--sub);';
  summ.textContent=`Нийт ${totalLinks} холболт хадгалагдсан байна. Утга оруулбал автоматаар хадгалагдана.`;
  bomCard.appendChild(summ);
  app.appendChild(bomCard);
}

    <div style="font-size:13px;line-height:1.8">
    Доорх 3 асуултын ядаж нэгэнд нь <b>"Тийм"</b> бол зөв түвшин — цаашид бүү задал:
    <ol style="padding-left:20px">
      <li>Үүнд тусад нь сэлбэг/item захиалж холбодог уу?</li>
      <li>Энэ өөрөө бие даан эвдэрч, тусад нь засвар/PM хийдэг үү?</li>
      <li>Үүнд тусад нь criticality (чухал зэрэг), тоолуур өгдөг үү?</li>
    </ol>
    <div style="background:#20362a;padding:8px 12px;border-radius:6px;margin:6px 0"><b style="color:var(--accent2)">ЗӨВ:</b> Насос систем → Насос #401, #402, #403 (тус бүр өөрийн сэлбэгтэй, тусад нь эвдэрдэг).</div>
    <div style="background:#3a2226;padding:8px 12px;border-radius:6px;margin:6px 0"><b style="color:var(--danger)">БУРУУ (хэт гүн):</b> Насос #401 → Adapter → Bolt. Bolt бол ITEM, тусдаа asset болгохгүй.</div>
    <div style="background:#3a2226;padding:8px 12px;border-radius:6px;margin:6px 0"><b style="color:var(--danger)">БУРУУ (хэт өнгөц):</b> Бүх насосыг нэг "Насос систем" болгож нэгтгэх — аль нь эвдэрснийг ялгахгүй болно.</div>
    <b>Энгийн шалгуур:</b> "Үүнийг сольж/засварлахдаа СЭЛБЭГ ЗАХИАЛДАГ уу? Тийм бол child asset. Зөвхөн бүхэлдээ солигддог жижиг эд анги бол ITEM."

  app.appendChild(done);
}

// ================= EXPORT TAB =================
function renderExport(app){
  const dept = session.role==='manager' ? session.deptName : (state.currentDept||null);

  // ---- Manager: өөрийн алба нэгжийн export ----
  if(session.role==='manager' || dept){
    const targetDept = dept;
    const myFather = state.fatherAssets.filter(a=>a.department===targetDept);
    const myChildren = state.childAssets.filter(c=>c.department===targetDept);
    const myChildIds = myChildren.map(c=>c.id);
    const myItems = state.items.filter(it=>it.department===targetDept);
    const myLinks = state.links.filter(l=>myChildIds.includes(l.child_asset_id));

    const myExp = card(`📥 ${targetDept||''} — Миний дата татах`, 'Өөрийн алба нэгжийн Asset, Child asset, Item жагсаалтыг татна.');

    // Asset export
    const b1 = document.createElement('button'); b1.className='btn'; b1.style.marginRight='8px';
    b1.textContent=`Father Asset (${myFather.length}) татах`;
    b1.onclick=()=>{
      const rows=[['Asset Number','Asset Description','Department']];
      myFather.forEach(a=>rows.push([a.code,a.name,a.department||'']));
      downloadCsv(rows,`${targetDept||'my'}-father-assets.csv`);
    };

    // Child asset export
    const b2 = document.createElement('button'); b2.className='btn'; b2.style.marginRight='8px';
    b2.textContent=`Child Asset (${myChildren.length}) татах`;
    b2.onclick=()=>{
      const rows=[['Father Asset Code','Father Asset Name','Child Asset','Тоо ш','Criticality','Category','Date In Service','Asset Cost','Asset Type','Deprn Method','Life Months','Location','Manufacturer','Model','Serial']];
      myChildren.forEach(c=>{
        const fa=state.fatherAssets.find(x=>x.id===c.father_id);
        rows.push([fa?fa.code:'',fa?fa.name:'',c.name,c.qty||'',c.criticality||'',c.category||'',c.date_in_service||'',c.asset_cost||'',c.asset_type||'',c.deprn_method||'',c.life_months||'',c.location||'',c.manufacturer||'',c.model||'',c.serial||'']);
      });
      downloadCsv(rows,`${targetDept||'my'}-child-assets.csv`);
    };

    // Item export
    const b3 = document.createElement('button'); b3.className='btn secondary'; b3.style.marginRight='8px';
    b3.textContent=`Item/Spare parts (${myItems.length}) татах`;
    b3.onclick=()=>{
      const statusLabel={active:'Идэвхтэй',removed:'Устгасан',remove_pending:'Хасах санал',needs_review:'Шалгагдаагүй'};
      const rows=[['Item Code','Item Name','Spec (Үзүүлэлт)','Equipment (Тоноглол)','Min','Max','UOM','Criticality','Status','UNSPSC Segment','UNSPSC Family','UNSPSC Class','UNSPSC Commodity','Note']];
      myItems.forEach(it=>{
        const u=getUnspsc(it.code)||{};
        rows.push([it.code,it.name,it.spec||'',it.equipment||'',it.min||'',it.max||'',it.uom||'',it.criticality||'',statusLabel[it.status]||it.status,u.segment||'',u.family||'',u.cls||'',u.commodity||'',it.note||'']);
      });
      downloadCsv(rows,`${targetDept||'my'}-items.csv`);
    };

    // Item-Asset link export
    const b4 = document.createElement('button'); b4.className='btn secondary';
    b4.textContent=`Item↔Asset холболт (${myLinks.length}) татах`;
    b4.onclick=()=>{
      const rows=[['Child Asset','Father Asset','Item Code','Item Name','Category','Min','Max','UOM','Тоо ш','Баталгаажсан']];
      myLinks.forEach(l=>{
        const c=state.childAssets.find(x=>x.id===l.child_asset_id);
        const fa=c?state.fatherAssets.find(x=>x.id===c.father_id):null;
        const it=state.items.find(x=>x.id===l.item_id);
        if(!c||!it) return;
        rows.push([c.name,fa?fa.name:'',it.code,it.name,l.corr_category||it.category||'',l.corr_min||it.min||'',l.corr_max||it.max||'',l.corr_uom||it.uom||'',l.qty||'',l.verified?'Тийм':'Үгүй']);
      });
      downloadCsv(rows,`${targetDept||'my'}-item-links.csv`);
    };

    const btnRow = document.createElement('div'); btnRow.style.display='flex'; btnRow.style.flexWrap='wrap'; btnRow.style.gap='8px';
    btnRow.append(b1,b2,b3,b4);
    myExp.appendChild(btnRow);
    app.appendChild(myExp);
  }

  // Admin-д нэмэлт export боломж
  if(session.role==='admin'){
    // Dept picker for admin
    if(!dept){
      const sel = card('Алба нэгжийн export-д алба нэгж сонгоно уу','');
      const s=document.createElement('select'); s.style.minWidth='200px';
      s.innerHTML='<option value="">-- сонгох --</option>'+state.departments.map(d=>`<option value="${escapeHtml(d.name)}">${escapeHtml(d.name)}</option>`).join('');
      s.onchange=()=>{state.currentDept=s.value||null; render();};
      sel.appendChild(s); app.appendChild(sel);
    }
    // Global exports (admin only)
    const c1 = card('Бүх Asset жагсаалт (нийт)', 'Father + Child asset бүгд.');
    const b1g = document.createElement('button'); b1g.className='btn'; b1g.textContent='CSV татах';
    b1g.onclick = ()=>{
      const rows = [['Father Code','Father Name','Department','Child Asset','Child Qty']];
      state.fatherAssets.forEach(fa=>{
        const children = state.childAssets.filter(c=>c.father_id===fa.id);
        if(children.length===0){ rows.push([fa.code, fa.name, fa.department||'', '', '']); }
        children.forEach(c=> rows.push([fa.code, fa.name, fa.department||'', c.name, c.qty||'']));
      });
      downloadCsv(rows, 'all-asset-structure.csv');
    };
    c1.appendChild(b1g); app.appendChild(c1);

  const c2 = card('Item холболт экспорт', 'Child asset тус бүрт хамаарах item, тоо ширхэг, баталгаажсан категори/min/max/UOM. Зөвхөн "Идэвхтэй" төлөвтэй item орно (Устгах/Хасах санал орохгүй).');
  const b2 = document.createElement('button'); b2.className='btn'; b2.textContent='CSV татах';
  b2.onclick = ()=>{
    const rows = [['Department','Father Asset','Child Asset','Item Code','Item Name','Category','Min','Max','UOM','Link Qty','Verified']];
    state.links.forEach(l=>{
      const c = state.childAssets.find(x=>x.id===l.child_asset_id);
      const fa = c ? state.fatherAssets.find(x=>x.id===c.father_id) : null;
      const it = state.items.find(x=>x.id===l.item_id);
      if(!c||!it) return;
      if(it.status==='removed' || it.status==='remove_pending') return;
      rows.push([fa?fa.department||'':'', fa?fa.name:'', c.name, it.code, it.name,
        l.corr_category||it.category, l.corr_min||it.min, l.corr_max||it.max, l.corr_uom||it.uom,
        l.qty||'', l.verified?'Yes':'No']);
    });
    downloadCsv(rows, 'item-links.csv');
  };
  c2.appendChild(b2);
  app.appendChild(c2);

  const c2b = card('Item Master эцсийн жагсаалт', 'Бүх item, тэдгээрийн эцсийн төлөв (Идэвхтэй/Устгах/Шалгагдаагүй) — Oracle-д ачаалахын өмнө "Шалгагдаагүй" мөр байхгүй эсэхийг шалгана уу.');
  const b2b = document.createElement('button'); b2b.className='btn'; b2b.textContent='CSV татах';
  b2b.onclick = ()=>{
    const rows = [['Item Code','Item Name','Category','Min','Max','UOM','Department','Status','Note']];
    const statusLabel = {active:'Идэвхтэй', removed:'Устгасан', remove_pending:'Хасах санал', needs_review:'Шалгагдаагүй'};
    state.items.forEach(it=>{
      rows.push([it.code, it.name, it.category, it.min, it.max, it.uom, it.department||'', statusLabel[it.status]||it.status, it.note||'']);
    });
    downloadCsv(rows, 'item-master-final.csv');
  };
  c2b.appendChild(b2b);
  app.appendChild(c2b);

  // ---- Oracle FBDI ready exports ----
  const cFA = card('⬇ Oracle FBDI — Asset (FA_MASS_ADDITIONS)', 'Child asset тус бүрийг Oracle FA Mass Additions баганаар. Гана эцэст нь санхүүгийн дутуу утгыг нөхөж, Oracle FBDI .xlsm-д хуулна.');
  const bFA = document.createElement('button'); bFA.className='btn'; bFA.textContent='Oracle Asset CSV татах';
  bFA.onclick = ()=>{
    const rows = [['ASSET_NUMBER','DESCRIPTION','ASSET_CATEGORY','DATE_PLACED_IN_SERVICE','ASSET_COST','ASSET_TYPE','DEPRN_METHOD','LIFE_IN_MONTHS','LOCATION','UNITS','CRITICALITY','MANUFACTURER','MODEL','SERIAL_NUMBER','DEPARTMENT','PARENT_ASSET']];
    state.childAssets.forEach(c=>{
      const fa = state.fatherAssets.find(x=>x.id===c.father_id);
      rows.push(['', c.name, c.category||'', c.date_in_service||'', c.asset_cost||'', c.asset_type||'', c.deprn_method||'', c.life_months||'', c.location||'', c.qty||'1', c.criticality||'', c.manufacturer||'', c.model||'', c.serial||'', c.department||'', fa?fa.name:'']);
    });
    downloadCsv(rows, 'oracle-fa-mass-additions.csv');
  };
  cFA.appendChild(bFA);
  app.appendChild(cFA);

  const cIT = card('⬇ Oracle FBDI — Item (EGP_SYSTEM_ITEMS)', 'Зөвхөн "Идэвхтэй" item-ийг Oracle Item Import баганаар. Устгах/Хасах санал орохгүй.');
  const bIT = document.createElement('button'); bIT.className='btn'; bIT.textContent='Oracle Item CSV татах';
  bIT.onclick = ()=>{
    const rows = [['TRANSACTION_TYPE','ORGANIZATION_CODE','ITEM_NUMBER','DESCRIPTION','ITEM_STATUS','ITEM_TYPE','PRIMARY_UOM_CODE','ITEM_CLASS','SOURCE_SYSTEM_CODE','UNSPSC_SEGMENT','UNSPSC_FAMILY','UNSPSC_CLASS','UNSPSC_COMMODITY_CODE','UNSPSC_COMMODITY_TITLE','MIN_QTY','MAX_QTY','CRITICALITY','DEPARTMENT']];
    state.items.forEach(it=>{
      if(it.status!=='active') return;
      const u=getUnspsc(it.code)||{};
      rows.push([it.transaction_type||'Create',it.org_code||'MMC',it.code,it.name,it.item_status||'Active',it.item_type||'',it.primary_uom||it.uom||'',it.item_class||'',it.source_system||'Legacy',u.segment||'',u.family||'',u.cls||'',u.codes?u.codes.com8:'',u.commodity||'',it.min||'',it.max||'',it.criticality||'',it.department||'']);
    });
    downloadCsv(rows, 'oracle-item-import.csv');
  };
  cIT.appendChild(bIT);
  app.appendChild(cIT);

  const c3 = card('Давхардсан item тайлан', 'Ижил нэртэй боловч өөр код-той item-ийн бүлгүүд.');
  const b3 = document.createElement('button'); b3.className='btn secondary'; b3.textContent='CSV татах';
  b3.onclick = ()=>{
    const groups = {};
    state.items.forEach(it=>{ const k = norm(it.name); (groups[k]=groups[k]||[]).push(it); });
    const rows = [['Нэр','Кодууд','Тоо']];
    Object.values(groups).filter(g=>g.length>1).forEach(g=> rows.push([g[0].name, g.map(x=>x.code).join(' | '), g.length]));
    downloadCsv(rows, 'duplicate-items.csv');
  };
  c3.appendChild(b3);
  app.appendChild(c3);
  } // end admin section
}

function downloadCsv(rows, filename){
  const csv = rows.map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

function card(title, desc){
  const c = document.createElement('div'); c.className='card';
  const h = document.createElement('h2'); h.textContent = title; c.appendChild(h);
  if(desc){ const d = document.createElement('div'); d.className='desc'; d.textContent = desc; c.appendChild(d); }
  return c;
}
function el(tag, cls, text){ const e = document.createElement(tag); e.className=cls; e.textContent=text; return e; }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

loadAll();
</script>
